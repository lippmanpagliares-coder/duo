      if (ch2){ const got = progress.emeralds[ch2.id]; g.fillStyle = got ? '#ffd54a' : '#5aff96'; g.beginPath(); g.arc(px+14,py+ch-14,6,0,Math.PI*2); g.fill();
        g.font = '10px sans-serif'; g.textAlign = 'left'; g.fillStyle = '#fff'; g.fillText(got ? 'Esmeralda ✔' : 'Esmeralda', px+24,py+ch-10); }
      if (b === 'village'){ g.font = '11px sans-serif'; g.textAlign = 'center'; g.fillStyle = '#fff'; g.fillText('⌂ Vila · portais, mestre, arena', px+cw/2, py+ch-12); }
      if (x === 4 && y === 3){ g.font = '11px sans-serif'; g.textAlign = 'center'; g.fillStyle = '#e8b0ff'; g.fillText('🌌 Portal do chefe final', px+cw/2, py+ch-12); }
    }
    const cxp = ox+currentScene.owX*cw, cyp = oy+currentScene.owY*ch;
    g.strokeStyle = `rgba(255,255,255,${0.6+0.4*pulse})`; g.lineWidth = 4; g.strokeRect(cxp+3,cyp+3,cw-6,ch-6);
    g.fillStyle = '#fff'; g.beginPath(); g.moveTo(cxp+cw/2-7,cyp-2); g.lineTo(cxp+cw/2+7,cyp-2); g.lineTo(cxp+cw/2,cyp+8); g.closePath(); g.fill();
    mapLabel(g, 'VOCÊ', cxp+cw/2, cyp-8, 11, 'center');
  } else if (mapCur){
    const ns = [...mapNodes.values()];
    const minx = Math.min(...ns.map(n=>n.gx)), maxx = Math.max(...ns.map(n=>n.gx)), miny = Math.min(...ns.map(n=>n.gy)), maxy = Math.max(...ns.map(n=>n.gy));
    const cols = maxx-minx+1, rows = maxy-miny+1;
    const cw = Math.min(170, 840/cols), ch = Math.min(84, 400/rows), ox = (W-cols*cw)/2, oy = (H-rows*ch)/2+14;
    mapLabel(g, 'MAPA', W/2, 46, 22, 'center');
    g.font = '13px sans-serif'; g.textAlign = 'center'; g.fillStyle = 'rgba(255,255,255,0.7)'; g.fillText('Você está em: '+mapCur.name, W/2, 68);
    const ctr = n=> [ox+(n.gx-minx)*cw+cw/2, oy+(n.gy-miny)*ch+ch/2];
    g.strokeStyle = '#5a78b8'; g.lineWidth = 3;
    ns.forEach(n=>{ const [ax,ay] = ctr(n); ['r','d'].forEach(d=>{ if (n.links[d]){ const [bx,by] = ctr(n.links[d]); g.beginPath(); g.moveTo(ax,ay); g.lineTo(bx,by); g.stroke(); } }); });
    const bw = cw-24, bh = ch-16;
    ns.forEach(n=>{
      const [ax,ay] = ctr(n), cur = n === mapCur;
      g.fillStyle = cur ? '#ffd54a' : '#2e4a86'; roundRect(g,ax-bw/2,ay-bh/2,bw,bh,8); g.fill();
      g.strokeStyle = cur ? `rgba(255,255,255,${0.6+0.4*pulse})` : '#5a78b8'; g.lineWidth = cur ? 3 : 1.5; roundRect(g,ax-bw/2,ay-bh/2,bw,bh,8); g.stroke();
      g.font = 'bold 11px sans-serif'; g.textAlign = 'center'; g.fillStyle = cur ? '#1a1400' : '#e8f0ff';
      const lines = wrapMapText(g, n.name, bw-10);
      lines.forEach((l,i)=> g.fillText(l, ax, ay-(lines.length-1)*6.5+i*13+4));
    });
    const [cx,cy] = ctr(mapCur);
    mapStubs().forEach(d=>{
      const px = d==='l' ? cx-bw/2-8 : d==='r' ? cx+bw/2+8 : cx, py = d==='u' ? cy-bh/2-8 : d==='d' ? cy+bh/2+8 : cy;
      g.fillStyle = `rgba(255,150,80,${0.6+0.4*pulse})`; g.beginPath(); g.arc(px,py,8,0,Math.PI*2); g.fill();
      g.fillStyle = '#1a0a00'; g.font = 'bold 11px sans-serif'; g.textAlign = 'center'; g.fillText('?',px,py+4);
    });
    g.font = '11px sans-serif'; g.textAlign = 'center'; g.fillStyle = 'rgba(255,170,110,0.9)'; g.fillText('? = saída que você ainda não explorou', W/2, H-38);
  } else {
    mapLabel(g, 'Nada explorado ainda', W/2, H/2, 18, 'center');
  }
  g.font = '12px sans-serif'; g.textAlign = 'center'; g.fillStyle = 'rgba(255,255,255,0.7)'; g.fillText('Toque na tela ou pressione M / Esc para fechar', W/2, H-18);
  g.restore();
}
const mapBtn = document.getElementById('mapBtn');
function canOpenMap(){
  const menuVisible = !menuOverlay.classList.contains('hidden'), endVisible = !endOverlay.classList.contains('hidden');
  return !!currentScene && !battle && !dialogueActive && !menuVisible && !endVisible && !settingsOpen && !panelOpen && (currentScene.isOpenWorld || !!mapCur);
}
function toggleMap(){ if (mapOpen) mapOpen = false; else if (canOpenMap()){ mapOpen = true; keys['arrowleft'] = keys['arrowright'] = keys['arrowup'] = keys['arrowdown'] = keys['a'] = keys['d'] = keys['w'] = keys['s'] = false; } }
mapBtn.addEventListener('click', toggleMap);
canvas.addEventListener('pointerdown', ()=>{ if (mapOpen) mapOpen = false; });

/* ---------------- chapter flow / menus ---------------- */
const menuOverlay = document.getElementById('menuOverlay');
const endOverlay = document.getElementById('endOverlay');
const endTitle = document.getElementById('endTitle');
const endText = document.getElementById('endText');
const endButtons = document.getElementById('endButtons');

let ch1 = null, ch2 = null, ch3 = null, ch4 = null, ch5 = null, chOpen = null;

function startChapter(n){
  mapReset(); mapOpen = false;
  menuOverlay.classList.add('hidden');
  endOverlay.classList.add('hidden');
  if (n===1){ player.type = 'duo'; ch1 = buildChapter1(); ch1.start(); }
  if (n===2){ player.type = 'astro'; ch2 = buildChapter2(); ch2.start(); }
  if (n===3){ player.type = 'duo'; ch3 = buildChapter3(); ch3.start(); }
  if (n===4){ player.type = 'duo'; ch4 = buildChapter4(); ch4.start(); }
  if (n===5){ player.type = 'duo'; ch5 = buildChapter5(); ch5.start(); }
  if (n==='open'){ player.type = 'duo'; chOpen = buildOpenWorld(); chOpen.start(); }
}
function endChapter(){
  unlocked.ch3 = true;
  showEndingScreen({
    title: 'Fim do Capítulo 2',
    text: 'Astro encontrou um aliado inesperado em Vulcrom. Mas o destino ainda vai colocá-lo no caminho de alguém conhecido...',
    buttons: [ {label:'Capítulo 3 →', fn:()=> startChapter(3)}, {label:'Menu', fn:showMenu, secondary:true} ]
  });
}
function endChapter3(){
  unlocked.ch4 = true;
  showEndingScreen({
    title: 'Fim do Capítulo 3 — Aliados',
    text: 'Duo, Astro e Huggy derrotaram a Arma Guardiã e agora têm um arsenal e uma Joia do Teleporte em mãos. Juntos, talvez tenham uma chance real contra o que vem por aí.',
    buttons: [ {label:'Capítulo 4 →', fn:()=> startChapter(4)}, {label:'Menu', fn:showMenu, secondary:true} ]
  });
}
function endChapter4(){
  unlocked.ch5 = true;
  showEndingScreen({
    title: 'Fim do Capítulo 4 — O Grande Castelo',
    text: 'Duo, Astro, Huggy e Cueio derrubaram o Gigante da saída e saíram com a Esmeralda dos Monstros, a do Disfarce e a dos Elementos. Mas o céu lá fora está mudando de cor — e algo se abre entre as dimensões...',
    buttons: [ {label:'Capítulo 5 →', fn:()=> startChapter(5)}, {label:'Menu', fn:showMenu, secondary:true} ]
  });
}
function endChapter5(){
  unlocked.open = true;
  showEndingScreen({
    title: 'Fim do Capítulo 5 — O Furacão Interdimensional',
    text: 'O portal se fechou e o furacão se desfez. As criaturas de todas as dimensões que caíram aqui agora vagam livres pelo mundo — e o caminho está aberto. O MUNDO ABERTO foi liberado: explore, enfrente monstros e volte aos capítulos quando quiser.',
    buttons: [ {label:'Explorar o Mundo Aberto →', fn:()=> startChapter('open')}, {label:'Menu', fn:showMenu, secondary:true} ]
  });
}
function endingDefeatCh3(){
  showEndingScreen({
    title: 'Final: Superados',
    text: 'A Arma Guardiã provou ser forte demais para os três. Talvez precisem se preparar melhor antes de tentar de novo.',
    buttons: [ {label:'Tentar novamente', fn:()=> startChapter(3)}, {label:'Menu', fn:showMenu, secondary:true} ]
  });
}
function showEndingScreen(opts){
  currentScene = null;
  sceneLocked = true;
  endOverlay.classList.remove('hidden');
  endButtons.innerHTML = '';
  endTitle.textContent = opts.title;
  endText.textContent = opts.text;
  (opts.buttons||[]).forEach(b=> mkEndBtn(b.label, b.fn, b.secondary));
}
function endingTrueCh1(){
  unlocked.ch2 = true;
  showEndingScreen({
    title: 'Fim do Capítulo 1 — A Vingança Desperta',
    text: 'As plantas antigas confiaram a Duo a Joia da Vida e um aviso: aquelas naves voltarão. Essa não é mais uma fuga — é o início de uma vingança.',
    buttons: [ {label:'Capítulo 2 →', fn:()=> startChapter(2)}, {label:'Menu', fn:showMenu, secondary:true} ]
  });
}
function endingEscapistCh1(){
  unlocked.ch2 = true;
  showEndingScreen({
    title: 'Final Escapista',
    text: 'Duo não olhou para trás. Correu sem parar, ignorando os sussurros das plantas de olho aberto. Escapou... mas sem a Joia da Vida, sem respostas, e sem saber ao certo para onde esse caminho vai realmente dar.',
    buttons: [ {label:'Capítulo 2 →', fn:()=> startChapter(2)}, {label:'Menu', fn:showMenu, secondary:true} ]
  });
}
function endingDeathCh1(){
  showEndingScreen({
    title: 'Final: Caído em Combate',
    text: 'O drone foi rápido demais dessa vez. Duo lutou com tudo o que tinha, mas não foi suficiente... Talvez uma nova tentativa mude o destino.',
    buttons: [ {label:'Tentar novamente', fn:()=> startChapter(1)}, {label:'Menu', fn:showMenu, secondary:true} ]
  });
}
function endingCowardCh1(){
  unlocked.ch2 = true;
  showEndingScreen({
    title: 'Final Covarde',
    text: 'Duo se enfiou debaixo do próprio ninho e ficou lá, quietinho, o coração disparado. Nenhuma luta, nenhuma fuga pela vila — só o barulho da nave lá fora, sumindo aos poucos. Ele sobreviveu... mas vai ter que conviver com essa escolha.',
    buttons: [ {label:'Capítulo 2 →', fn:()=> startChapter(2)}, {label:'Menu', fn:showMenu, secondary:true} ]
  });
}
function mkEndBtn(label, fn, secondary){
  const b = document.createElement('button');
  b.className = 'gameBtn' + (secondary ? ' secondary' : '');
  b.textContent = label; b.onclick = fn;
  endButtons.appendChild(b);
}
function showMenu(){
  mapReset(); mapOpen = false;
  currentScene = null;
  endOverlay.classList.add('hidden');
  menuOverlay.classList.remove('hidden');
  document.getElementById('btnCh2').classList.toggle('locked', false);
}
document.getElementById('btnCh1').onclick = ()=> startChapter(1);
document.getElementById('btnCh2').onclick = ()=> startChapter(2);
document.getElementById('btnCh3').onclick = ()=> startChapter(3);
document.getElementById('btnCh4').onclick = ()=> startChapter(4);
document.getElementById('btnCh5').onclick = ()=> startChapter(5);
document.getElementById('btnOpen').onclick = ()=> startChapter('open');

/* ---------------- pause / settings menu ---------------- */
const settingsBtn = document.getElementById('settingsBtn');
const settingsOverlay = document.getElementById('settingsOverlay');
const segDifficulty = document.getElementById('segDifficulty');
const segQuality = document.getElementById('segQuality');
const selLanguage = document.getElementById('selLanguage');
const rangeScale = document.getElementById('rangeScale');
const rangeSafe = document.getElementById('rangeSafe');
let settingsOpen = false;

function applyScale(){
  document.documentElement.style.setProperty('--ui-scale', settings.scale/100);
  document.getElementById('valScale').textContent = settings.scale + '%';
}
function applySafeArea(){
  document.documentElement.style.setProperty('--safe', settings.safe + 'px');
  document.getElementById('valSafe').textContent = settings.safe + 'px';
}
function applyQuality(){
  document.body.classList.toggle('lowfx', settings.quality === 'baixa');
}
function refreshSettingsUI(){
  [...segDifficulty.children].forEach(b=> b.classList.toggle('active', b.dataset.val === settings.difficulty));
  [...segQuality.children].forEach(b=> b.classList.toggle('active', b.dataset.val === settings.quality));
  selLanguage.value = settings.language;
  rangeScale.value = settings.scale;
  rangeSafe.value = settings.safe;
  applyScale(); applySafeArea(); applyQuality();
}
function toggleSettings(){ settingsOpen ? closeSettings() : openSettings(); }
function openSettings(){
  settingsOpen = true;
  refreshSettingsUI();
  settingsOverlay.classList.add('open');
}
function closeSettings(){
  settingsOpen = false;
  settingsOverlay.classList.remove('open');
}
function forceStopEverything(){
  if (battle){ battleOverlay.style.display = 'none'; battleAttackBtn.style.display = 'none'; battleSpecialBtn.style.display = 'none'; battle = null; }
  dialogueActive = false; dialogueQueue = []; dialogueIdx = 0; dialogueOnEnd = null;
  document.getElementById('dialogueBox').style.display = 'none';
  sceneLocked = false;
}

settingsBtn.addEventListener('click', toggleSettings);
document.getElementById('btnResume').addEventListener('click', closeSettings);
document.getElementById('btnCloseSettings').addEventListener('click', closeSettings);
document.getElementById('btnGoWorld').addEventListener('click', ()=>{
  forceStopEverything();
  closeSettings();
  showMenu();
});
document.getElementById('btnRestart').addEventListener('click', ()=>{
  forceStopEverything();
  unlocked = { ch2:false, ch3:false, ch4:false, ch5:false, open:false };
  upgrades = { jewelOfLife:false, emeraldOfPower:false, alienWeapon:false, teleportGem:false, elementalEmerald:false, disguiseEmerald:false, monsterEmerald:false };
  progress = freshProgress();
  closeSettings();
  showMenu();
});
segDifficulty.addEventListener('click', e=>{
  const b = e.target.closest('.segBtn'); if (!b) return;
  settings.difficulty = b.dataset.val;
  refreshSettingsUI();
});
segQuality.addEventListener('click', e=>{
  const b = e.target.closest('.segBtn'); if (!b) return;
  settings.quality = b.dataset.val;
  refreshSettingsUI();
});
selLanguage.addEventListener('change', ()=>{ settings.language = selLanguage.value; });
rangeScale.addEventListener('input', ()=>{ settings.scale = +rangeScale.value; applyScale(); });
rangeSafe.addEventListener('input', ()=>{ settings.safe = +rangeSafe.value; applySafeArea(); });
refreshSettingsUI();

/* ---------------- main loop ---------------- */
let lastT = performance.now();
function loop(t){
  const dt = Math.min(0.05,(t-lastT)/1000); lastT = t;
  try {
    if (fxHitStop > 0){
      fxHitStop -= dt;          // freeze-frame: the world holds for a beat on heavy hits
    } else {
      if (!settingsOpen && !panelOpen && !mapOpen){
        updateExploration(dt);
        updateBattle(dt);
      }
      updateFx(dt);
    }
    updateActionButton();
    updateInventoryHud();
    renderScene();
  } catch(err){
    // a bug in one frame must never permanently freeze the whole game —
    // log it and keep the loop alive so the player can still act next frame
    console.error('loop error', err);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
