<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fuga Alienígena</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#0a0e1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duo">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --ui-scale:1; --safe:0px;
    /* HUD scales with the smaller screen dimension so nothing overflows or hides the game on small/short phones */
    --sp-1: clamp(3px, 1vmin, 6px);
    --sp-2: clamp(6px, 2vmin, 12px);
    --sp-3: clamp(10px, 3vmin, 20px);
    --font-xs: clamp(9px, 2.6vmin, 12px);
    --font-sm: clamp(11px, 3vmin, 14px);
    --font-md: clamp(13px, 3.6vmin, 16px);
    --font-lg: clamp(16px, 5vmin, 22px);
    --font-xl: clamp(20px, 7vmin, 38px);
    --btn-sm: clamp(28px, 7vmin, 38px);
    --btn-md: clamp(46px, 15vmin, 78px);
    --btn-lg: clamp(50px, 18vmin, 86px);
    --dlg-h: clamp(60px, 24vmin, 110px);
  }
  /* repeated taps on game buttons (attack!) must never be read as double-tap-to-zoom */
  button { touch-action:manipulation; -webkit-user-select:none; user-select:none; }
  html,body {
    width:100%; height:100%; background:#0a0e1a; overflow:hidden;
    font-family:'Trebuchet MS','Segoe UI',sans-serif; color:#eef;
  }
  #wrap {
    position:relative; width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
  }
  #stage {
    position:relative; width:min(960px, 100vw, calc(100vh * 8 / 5)); aspect-ratio:8/5; max-height:100vh;
    background:#000; border:3px solid #2a3a63; border-radius:6px; overflow:hidden;
    box-shadow:0 0 50px rgba(80,140,255,0.25);
    transform:scale(var(--ui-scale)); transition:transform 0.15s ease;
  }
  /* iOS Safari's 100vh includes the collapsible toolbar area, overflowing the real screen —
     dvh reflects what's actually visible, so prefer it wherever it's supported */
  @supports (height: 100dvh) {
    #wrap { height:100dvh; }
    #stage { width:min(960px, 100vw, calc(100dvh * 8 / 5)); max-height:100dvh; }
  }
  body.lowfx * { box-shadow:none !important; text-shadow:none !important; }
  canvas { display:block; background:#123; image-rendering:pixelated; width:100%; height:100%; }

  #hint {
    position:absolute; left:50%; bottom:calc(96px + var(--safe)); transform:translateX(-50%);
    background:rgba(10,14,26,0.75); border:1px solid #4a5a8a; border-radius:6px;
    padding:var(--sp-1) var(--sp-2); font-size:var(--font-sm); color:#ffd54a; letter-spacing:1px;
    pointer-events:none; display:none; white-space:nowrap;
  }
  /* on touch devices the tappable buttons (D-pad, Interagir, Atacar) already show the controls —
     keyboard-only text hints are just clutter that can overlap them */
  @media (pointer:coarse){ #hint, .kbdHint { display:none !important; } }
  #chapterBanner {
    position:absolute; top:calc(26px + var(--safe)); left:50%; transform:translateX(-50%);
    font-size:var(--font-xl); letter-spacing:3px; color:#7ef9ff;
    text-shadow:0 0 16px rgba(126,249,255,0.8);
    opacity:0; transition:opacity 0.6s; pointer-events:none; text-align:center;
  }
  #flash {
    position:absolute; inset:0; background:#ff2244; opacity:0; pointer-events:none;
    transition:opacity 0.08s;
  }

  #inventoryHud {
    position:absolute; top:calc(var(--sp-2) + var(--safe)); left:calc(var(--sp-2) + var(--safe)); z-index:15;
    display:flex; gap:var(--sp-1); pointer-events:none;
  }
  .invSlot {
    width:var(--btn-sm); height:var(--btn-sm); border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-size:var(--font-lg); background:rgba(10,14,26,0.7); border:1px solid #3a4a70;
    filter:grayscale(1) brightness(0.35); opacity:0.55; transition:filter 0.3s, opacity 0.3s, box-shadow 0.3s;
  }
  .invSlot.owned {
    filter:none; opacity:1; box-shadow:0 0 12px rgba(255,213,74,0.55); border-color:#ffd54a;
  }

  /* dialogue box */
  #dialogueBox {
    position:absolute; left:calc(var(--sp-3) + var(--safe)); right:calc(var(--sp-3) + var(--safe)); bottom:calc(var(--sp-2) + var(--safe));
    min-height:var(--dlg-h);
    background:rgba(8,10,20,0.92); border:2px solid #4a5a8a; border-radius:10px;
    padding:var(--sp-2) var(--sp-3); display:none; flex-direction:column; gap:var(--sp-1);
    box-shadow:0 0 30px rgba(0,0,0,0.6);
  }
  #dialogueSpeaker { font-weight:bold; font-size:var(--font-md); letter-spacing:1px; }
  #dialogueText { font-size:var(--font-md); line-height:1.4; color:#dfe8ff; min-height:clamp(24px, 9vmin, 44px); }
  #dialogueAdvance { align-self:flex-end; font-size:var(--font-xs); color:#8fa; opacity:0.85; }

  #actionBtn {
    position:absolute; right:calc(var(--sp-3) + var(--safe)); bottom:calc(var(--sp-3) + var(--safe)); z-index:20;
    width:var(--btn-md); height:var(--btn-md); border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(180deg,#ffd54a,#b8860b); color:#2a1a00;
    font-family:inherit; font-weight:bold; font-size:var(--font-sm); letter-spacing:0.5px;
    box-shadow:0 0 20px rgba(255,213,74,0.55);
    display:none; align-items:center; justify-content:center; text-align:center; line-height:1.2;
  }
  #actionBtn:active { filter:brightness(0.9); transform:scale(0.96); }
  /* while a dialogue is open, lift the button clear above the dialogue box instead of
     overlapping its text — this must always stay clickable, it's the only way to advance
     if a tap on the box itself doesn't register */
  #actionBtn.duringDialogue { bottom:calc(var(--dlg-h) + var(--sp-2) + var(--safe)); }

  #battleAttackBtn {
    position:absolute; right:calc(var(--sp-3) + var(--safe)); bottom:calc(var(--sp-3) + var(--safe)); z-index:20; pointer-events:auto;
    width:var(--btn-lg); height:var(--btn-lg); border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(180deg,#c9a0ff,#7a3fd0); color:#1a0a2e;
    font-family:inherit; font-weight:bold; font-size:var(--font-lg);
    box-shadow:0 0 22px rgba(154,95,224,0.6);
    display:none; align-items:center; justify-content:center;
  }
  #battleAttackBtn:active { filter:brightness(0.9); transform:scale(0.96); }
  #battleAttackBtn:disabled { filter:grayscale(0.6) brightness(0.7); cursor:default; }

  /* open-world backpack: upgrades / roster / achievements panel */
  #packBtn {
    position:absolute; top:calc(var(--sp-2) + var(--safe)); right:calc(var(--sp-2)*2 + var(--btn-sm) + var(--safe)); z-index:30; pointer-events:auto;
    width:var(--btn-sm); height:var(--btn-sm); border-radius:8px; border:1px solid #6a5a20; cursor:pointer; display:none;
    background:rgba(40,30,8,0.8); color:#ffe27a; font-size:var(--font-lg); align-items:center; justify-content:center;
  }
  #packBtn.show { display:flex; }
  #mapBtn {
    position:absolute; top:calc(var(--sp-2) + var(--safe)); right:calc(var(--sp-2)*3 + var(--btn-sm)*2 + var(--safe)); z-index:30; pointer-events:auto;
    width:var(--btn-sm); height:var(--btn-sm); border-radius:8px; border:1px solid #3a5a90; cursor:pointer; display:none;
    background:rgba(10,20,44,0.8); color:#9fd0ff; font-size:var(--font-lg); align-items:center; justify-content:center;
  }
  #mapBtn.show { display:flex; }
  #mapBtn.solo { right:calc(var(--sp-2)*2 + var(--btn-sm) + var(--safe)); }
  #panelOverlay { position:absolute; inset:0; z-index:45; display:none; align-items:center; justify-content:center; background:rgba(4,6,14,0.86); }
  #panelOverlay.open { display:flex; }
  #panelBox {
    width:min(720px,95%); max-height:92%; display:flex; flex-direction:column; gap:var(--sp-2);
    background:linear-gradient(180deg,#171c34,#0c0f1e); border:1px solid #3a4a70; border-radius:12px; padding:var(--sp-3);
  }
  .panelTabs { display:flex; gap:8px; flex-wrap:wrap; }
  .panelTabs .segBtn { min-width:0; }
  #panelBody { overflow-y:auto; display:flex; flex-direction:column; gap:8px; font-size:var(--font-sm); color:#dfe8ff; }
  .pRow { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.05); border:1px solid #2a3a63; border-radius:8px; padding:8px 10px; }
  .pRow .pInfo { flex:1; min-width:0; }
  .pRow .pTitle { font-weight:bold; color:#fff; }
  .pRow .pSub { font-size:var(--font-xs); color:#9fb3d8; }
  .pRow.locked { opacity:0.55; }
  .pRow.done { border-color:#4a8a4a; background:rgba(60,140,60,0.12); }
  .pBtn { padding:6px 12px; border:none; border-radius:7px; cursor:pointer; font-family:inherit; font-weight:bold; font-size:var(--font-xs);
    background:linear-gradient(180deg,#1fd0ff,#0088cc); color:#001622; }
  .pBtn:disabled { background:#2a3550; color:#6a7a95; cursor:default; }
  .pBtn.alt { background:linear-gradient(180deg,#ffe27a,#c98a10); color:#3a2400; }
  .pHead { display:flex; justify-content:space-between; align-items:center; font-weight:bold; color:#ffe27a; }

  /* dash (touch) and the special-move button (battle only) */
  #dashBtn, #battleSpecialBtn {
    position:absolute; z-index:20; pointer-events:auto; border:none; cursor:pointer; border-radius:50%;
    font-family:inherit; font-weight:bold; font-size:var(--font-lg); align-items:center; justify-content:center;
  }
  #dashBtn {
    right:calc(var(--sp-3) + var(--safe)); bottom:calc(var(--btn-lg) + var(--sp-3)*2 + var(--safe));
    width:var(--btn-md); height:var(--btn-md); display:none;
    background:linear-gradient(180deg,#7fe8ff,#1f8fbf); color:#00303f; box-shadow:0 0 18px rgba(80,210,255,0.55);
  }
  @media (pointer:coarse){ #dashBtn.enabled { display:flex; } }
  #dashBtn:active { filter:brightness(0.9); transform:scale(0.95); }
  #battleSpecialBtn {
    right:calc(var(--btn-lg) + var(--sp-3)*2 + var(--safe)); bottom:calc(var(--sp-3) + var(--safe));
    width:var(--btn-md); height:var(--btn-md); display:none;
    background:linear-gradient(180deg,#ffe27a,#c98a10); color:#3a2400; box-shadow:0 0 14px rgba(255,210,90,0.35);
  }
  #battleSpecialBtn:disabled { filter:grayscale(0.85) brightness(0.55); cursor:default; box-shadow:none; }
  #battleSpecialBtn.ready { animation:specPulse 0.7s ease-in-out infinite alternate; }
  @keyframes specPulse { from{ box-shadow:0 0 14px rgba(255,210,90,0.5); transform:scale(1); } to{ box-shadow:0 0 34px rgba(255,230,120,0.95); transform:scale(1.08); } }
  .specBg { width:100%; height:clamp(4px,1.4vmin,7px); margin-top:4px; background:#2a2010; border:1px solid #6a5420; border-radius:5px; overflow:hidden; }
  .specFill { height:100%; width:0; background:linear-gradient(90deg,#ffb020,#ffe27a); transition:width 0.25s ease; }
  .specFill.full { background:linear-gradient(90deg,#fff2a8,#ffd54a); box-shadow:0 0 8px #ffd54a; }

  /* on-screen movement D-pad — touch devices only (phones/tablets have no arrow keys) */
  #dpad {
    position:absolute; left:calc(10px + var(--safe)); bottom:calc(10px + var(--safe)); z-index:20;
    display:none; grid-template-columns:repeat(3, clamp(34px, 8vmin, 56px)); grid-template-rows:repeat(3, clamp(34px, 8vmin, 56px)); gap:clamp(2px, 0.8vmin, 4px);
  }
  @media (pointer:coarse){ #dpad.enabled { display:grid; } }
  .dpadBtn {
    border:none; border-radius:20%; background:rgba(20,26,46,0.6); color:#cfe0ff; font-size:clamp(14px, 3.5vmin, 22px);
    display:flex; align-items:center; justify-content:center; user-select:none; -webkit-user-select:none;
    touch-action:none; border:1px solid rgba(126,249,255,0.3);
  }
  .dpadBtn:active { background:rgba(126,249,255,0.35); }
  #dpadUp{grid-column:2;grid-row:1;}
  #dpadLeft{grid-column:1;grid-row:2;}
  #dpadRight{grid-column:3;grid-row:2;}
  #dpadDown{grid-column:2;grid-row:3;}

  /* overlays: menu / chapter end */
  .fullOverlay {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:var(--sp-2); text-align:center;
    background:radial-gradient(ellipse at center, #10182e 0%, #05070f 100%);
    padding:var(--sp-2); overflow-y:auto;
  }
  .fullOverlay h1 { font-size:var(--font-xl); color:#7ef9ff; text-shadow:0 0 20px #00c8ff; letter-spacing:3px; }
  .fullOverlay h2 { font-size:clamp(16px, 6vmin, 24px); color:#ffd54a; text-shadow:0 0 14px rgba(255,213,74,0.6); }
  .fullOverlay p { max-width:90%; font-size:var(--font-sm); line-height:1.5; color:#9fb; }
  .btnRow { display:flex; gap:var(--sp-2); flex-wrap:wrap; justify-content:center; }
  .gameBtn {
    padding:var(--sp-2) var(--sp-3); font-size:var(--font-sm); font-family:inherit; letter-spacing:1px;
    border:none; border-radius:8px; cursor:pointer; font-weight:bold;
    background:linear-gradient(180deg,#1fd0ff,#0088cc); color:#001622;
    box-shadow:0 0 18px rgba(0,200,255,0.5);
  }
  .gameBtn.secondary { background:linear-gradient(180deg,#5cff9a,#1e9955); color:#002a12; }
  .gameBtn.locked { background:#2a3550; color:#6a7a95; cursor:not-allowed; box-shadow:none; }
  .gameBtn:hover:not(.locked) { filter:brightness(1.15); }
  .hidden { display:none !important; }

  /* battle — slim real-time HUD; the arena itself renders on the game canvas underneath */
  #battleOverlay {
    position:absolute; inset:0; display:none; flex-direction:column; justify-content:space-between;
    padding:calc(var(--sp-2) + var(--safe)) calc(var(--sp-3) + var(--safe)); pointer-events:none; z-index:12;
  }
  #battleTitle { text-align:center; font-size:var(--font-md); letter-spacing:2px; color:#c9a8ff; text-shadow:0 0 10px rgba(201,168,255,0.6); }
  #battleHudTop { display:flex; justify-content:space-between; gap:var(--sp-2); margin-top:var(--sp-1); }
  .battleHpCard { flex:1 1 0; min-width:0; max-width:260px; background:rgba(10,6,18,0.72); border:1px solid #3a2a4a; border-radius:8px; padding:var(--sp-1) var(--sp-2); }
  .battleHpCard.enemy { align-self:flex-end; }
  .hpLabel { font-size:var(--font-sm); color:#dfe8ff; margin-bottom:5px; display:flex; justify-content:space-between; gap:6px; }
  .hpLabel span:first-child { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hpLabel span:last-child { flex:0 0 auto; white-space:nowrap; }
  .hpBarBg { width:100%; height:clamp(6px, 2.2vmin, 11px); background:#241a30; border:1px solid #55406a; border-radius:6px; overflow:hidden; }
  .hpBarFill { height:100%; background:linear-gradient(90deg,#5cff9a,#1e9955); transition:width 0.35s ease; }
  .hpBarFill.enemy { background:linear-gradient(90deg,#ff6a6a,#a01e1e); }
  #battleToast {
    align-self:center; background:rgba(10,6,18,0.8); border:1px solid #3a2a4a; border-radius:8px;
    padding:var(--sp-1) var(--sp-2); font-size:var(--font-sm); color:#e8d8ff; opacity:0; transition:opacity 0.3s; text-align:center; max-width:86%;
  }
  #battleHint { align-self:center; font-size:var(--font-xs); color:#c9a8ff; opacity:0.8; margin-bottom:4px; }
  @media (pointer:coarse){ #battleHint { display:none !important; } }
  #battleActions { display:flex; gap:var(--sp-1); justify-content:center; flex-wrap:wrap; pointer-events:auto; }
  .battleBtn {
    padding:var(--sp-1) var(--sp-2); font-family:inherit; font-size:var(--font-sm); font-weight:bold; letter-spacing:0.5px;
    border:none; border-radius:8px; cursor:pointer; color:#fff;
    background:linear-gradient(180deg,#7a4ad0,#4a2a90); box-shadow:0 0 12px rgba(120,80,220,0.5);
  }
  .battleBtn:hover { filter:brightness(1.2); }
  .battleBtn:disabled { background:#2a2540; color:#6a6a80; cursor:not-allowed; box-shadow:none; }

  /* pause / settings */
  #settingsBtn {
    position:absolute; top:calc(var(--sp-2) + var(--safe)); right:calc(var(--sp-2) + var(--safe)); z-index:30; pointer-events:auto;
    width:var(--btn-sm); height:var(--btn-sm); border-radius:8px; border:1px solid #3a4a70; cursor:pointer;
    background:rgba(10,14,26,0.75); color:#cfe0ff; font-size:var(--font-lg);
    display:flex; align-items:center; justify-content:center;
  }
  #settingsBtn:hover { background:rgba(30,40,70,0.92); }
  #settingsOverlay {
    position:absolute; inset:0; z-index:40; display:none; align-items:center; justify-content:center;
    background:rgba(4,6,14,0.82);
  }
  #settingsOverlay.open { display:flex; }
  #settingsPanel {
    width:min(560px, 92%); max-height:86%; overflow-y:auto;
    background:linear-gradient(180deg,#141a30,#0c0f1e); border:1px solid #3a4a70; border-radius:12px;
    padding:22px 26px; display:flex; flex-direction:column; gap:16px;
    box-shadow:0 0 40px rgba(0,0,0,0.6);
  }
  #settingsPanel h2 { font-size:20px; color:#7ef9ff; letter-spacing:1px; text-align:center; }
  .settingsRow { display:flex; flex-direction:column; gap:7px; }
  .settingsRow label { font-size:11.5px; letter-spacing:1px; color:#9fb3d8; text-transform:uppercase; display:flex; justify-content:space-between; }
  .segGroup { display:flex; gap:8px; flex-wrap:wrap; }
  .segBtn {
    flex:1; min-width:80px; padding:8px 10px; font-family:inherit; font-size:13px; font-weight:bold;
    border:1px solid #3a4a70; border-radius:7px; background:#1a2340; color:#cfe0ff; cursor:pointer;
  }
  .segBtn.active { background:linear-gradient(180deg,#1fd0ff,#0088cc); color:#001622; border-color:#1fd0ff; }
  .segBtn:hover:not(.active) { filter:brightness(1.2); }
  .settingsRow select {
    padding:8px 10px; font-family:inherit; font-size:13px; background:#1a2340; color:#cfe0ff;
    border:1px solid #3a4a70; border-radius:7px;
  }
  .settingsRow input[type=range] { width:100%; }
  .settingsVal { color:#7ef9ff; font-size:11px; letter-spacing:0; text-transform:none; }
  .settingsActions { display:flex; gap:12px; justify-content:center; margin-top:2px; flex-wrap:wrap; }
  .settingsHr { border:none; border-top:1px solid #2a3a63; margin:2px 0; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="960" height="600"></canvas>
    <div id="flash"></div>
    <div id="chapterBanner"></div>
    <div id="hint"></div>
    <div id="inventoryHud">
      <div class="invSlot" id="invJewel" title="Joia da Vida">💚</div>
      <div class="invSlot" id="invEmerald" title="Esmeralda do Poder">💎</div>
      <div class="invSlot" id="invWeapon" title="Arma Alienígena">🔫</div>
      <div class="invSlot" id="invTeleport" title="Joia do Teleporte">🌀</div>
      <div class="invSlot" id="invElemental" title="Esmeralda dos Elementos (+40 de ataque)">🟠</div>
      <div class="invSlot" id="invDisguise" title="Esmeralda do Disfarce">🎭</div>
      <div class="invSlot" id="invMonster" title="Esmeralda dos Monstros">👹</div>
    </div>
    <button id="actionBtn" type="button">Interagir</button>
    <button id="battleAttackBtn" type="button" title="Atacar">⚔</button>
    <button id="battleSpecialBtn" type="button" title="Golpe especial (K)" disabled>✨</button>
    <button id="dashBtn" type="button" title="Dash (Shift)">💨</button>
    <button id="settingsBtn" type="button" title="Menu / Configurações">⚙</button>

    <div id="dpad">
      <button class="dpadBtn" id="dpadUp" type="button">▲</button>
      <button class="dpadBtn" id="dpadLeft" type="button">◀</button>
      <button class="dpadBtn" id="dpadRight" type="button">▶</button>
      <button class="dpadBtn" id="dpadDown" type="button">▼</button>
    </div>

    <button id="mapBtn" type="button" title="Mapa (M)">🗺</button>
    <button id="packBtn" type="button" title="Mochila: melhorias, personagens e conquistas">🎒</button>
    <div id="panelOverlay">
      <div id="panelBox">
        <div class="panelTabs" id="panelTabs">
          <button class="segBtn" data-tab="up">⬆ Melhorias</button>
          <button class="segBtn" data-tab="chars">🧑 Personagens</button>
          <button class="segBtn" data-tab="ach">🏆 Conquistas</button>
        </div>
        <div id="panelBody"></div>
        <div class="settingsActions"><button class="gameBtn" id="panelClose">Fechar</button></div>
      </div>
    </div>

    <div id="settingsOverlay">
      <div id="settingsPanel">
        <h2>Menu</h2>
        <div class="settingsActions">
          <button class="gameBtn" id="btnResume">▶ Continuar</button>
          <button class="gameBtn secondary" id="btnGoWorld">🌎 Selecionar capítulo</button>
        </div>

        <hr class="settingsHr">

        <div class="settingsRow">
          <label>Dificuldade</label>
          <div class="segGroup" id="segDifficulty">
            <button class="segBtn" data-val="facil">Fácil</button>
            <button class="segBtn" data-val="normal">Normal</button>

/* ---------------- sound (synthesized, no audio files needed) ---------------- */
let audioCtx = null;
function getAudioCtx(){
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function beep(freq, duration, type, volume, delay){
  try{
    const ctx = getAudioCtx();
    const startAt = ctx.currentTime + (delay||0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, startAt);
    gain.gain.setValueAtTime(volume||0.15, startAt);
    gain.gain.exponentialRampToValueAtTime(0.001, startAt + duration);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(startAt); osc.stop(startAt + duration + 0.02);
  } catch(e){ /* audio not available — fail silently */ }
}

/* ---------------- character drawing ---------------- */
// all sprites are procedurally drawn (no image assets needed)
// soft radial gradient standing in for volume/lighting on a rounded body shape
function volumeGrad(g,cx,cy,r,light,dark){
  const gr = g.createRadialGradient(cx-r*0.35,cy-r*0.42,r*0.05,cx,cy,r*1.25);
  gr.addColorStop(0,light); gr.addColorStop(1,dark);
  return gr;
}
// soft contact shadow grounding a character at its feet
function groundShadow(g,s,yOff){
  g.save();
  g.fillStyle = 'rgba(0,0,0,0.25)';
  g.beginPath(); g.ellipse(0, yOff, s*0.36, s*0.09, 0, 0, Math.PI*2); g.fill();
  g.restore();
}
// lightens a #rrggbb color by a flat amount per channel — used to build volumeGrad's highlight stop
function lighten(hex, amt){
  const n = parseInt(hex.slice(1),16);
  const r = Math.min(255,((n>>16)&255)+amt), gg = Math.min(255,((n>>8)&255)+amt), b = Math.min(255,(n&255)+amt);
  return `rgb(${r},${gg},${b})`;
}
function roundRect(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);
  g.arcTo(x,y,x+w,y,r);
  g.closePath();
}
// full-body owl: feet, tapered body, head tufts, belly, wing, beak — palette-driven so parents can reuse it
function drawOwlAdult(g,x,y,s,facing,opts){
  opts = opts || {};
  const bodyColor = opts.body || '#4fb800';
  const bellyColor = opts.belly || '#eaffe0';
  const wingColor = opts.wing || '#3a8f00';
  const beakColor = opts.beak || '#ffb020';

  g.save(); g.translate(x,y);
  groundShadow(g, s, s*0.86);
  // feet
  g.fillStyle = beakColor;
  g.beginPath(); g.ellipse(-s*0.22, s*0.8, s*0.14, s*0.09, 0,0,Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(s*0.22, s*0.8, s*0.14, s*0.09, 0,0,Math.PI*2); g.fill();
  // body (tapered egg shape, wider base than head) — radial shading gives it roundness instead of a flat blob
  g.fillStyle = volumeGrad(g, -s*0.15, -s*0.15, s*0.75, lighten(bodyColor,55), bodyColor);
  g.beginPath();
  g.moveTo(-s*0.6, s*0.05);
  g.bezierCurveTo(-s*0.6,-s*0.58,-s*0.3,-s*0.86,0,-s*0.86);
  g.bezierCurveTo(s*0.3,-s*0.86,s*0.6,-s*0.58,s*0.6,s*0.05);
  g.bezierCurveTo(s*0.6,s*0.5,s*0.32,s*0.74,0,s*0.74);
  g.bezierCurveTo(-s*0.32,s*0.74,-s*0.6,s*0.5,-s*0.6,s*0.05);
  g.closePath(); g.fill();
  // head feather tufts
  g.fillStyle = bodyColor;
  g.beginPath(); g.moveTo(-s*0.2,-s*0.8); g.lineTo(-s*0.3,-s*1.02); g.lineTo(-s*0.06,-s*0.86); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(s*0.2,-s*0.8); g.lineTo(s*0.3,-s*1.02); g.lineTo(s*0.06,-s*0.86); g.closePath(); g.fill();
  // belly patch, lightly shaded too so it doesn't look like a flat sticker
  g.fillStyle = volumeGrad(g, -s*0.06, s*0.08, s*0.4, '#ffffff', bellyColor);
  g.beginPath(); g.ellipse(0, s*0.2, s*0.32, s*0.4, 0,0,Math.PI*2); g.fill();
  // a couple of soft feather-seam lines on the belly for texture
  g.strokeStyle = `rgba(0,0,0,0.08)`; g.lineWidth = s*0.025;
  g.beginPath(); g.moveTo(-s*0.14,-s*0.05); g.quadraticCurveTo(0,s*0.02,-s*0.1,s*0.5); g.stroke();
  g.beginPath(); g.moveTo(s*0.14,-s*0.05); g.quadraticCurveTo(0,s*0.02,s*0.1,s*0.5); g.stroke();
  // wing, shaded so it reads as a separate rounded surface rather than a flat patch
  g.fillStyle = volumeGrad(g, -s*0.56*facing-s*0.05, -s*0.08, s*0.28, lighten(wingColor,40), wingColor);
  g.beginPath(); g.ellipse(-s*0.56*facing, 0, s*0.15, s*0.3, 0.3*facing, 0, Math.PI*2); g.fill();
  g.strokeStyle = `rgba(0,0,0,0.15)`; g.lineWidth = s*0.02;
  g.beginPath(); g.ellipse(-s*0.56*facing, 0, s*0.15, s*0.3, 0.3*facing, 0, Math.PI*2); g.stroke();
  // eyes
  eyesBig(g, s, opts.eyeWhite||'#fff', opts.eyePupil||'#1a1a1a', -0.28);
  // beak, with a subtle gradient so it's not perfectly flat
  g.fillStyle = volumeGrad(g, -s*0.03, 0, s*0.16, lighten(beakColor,50), beakColor);
  g.beginPath(); g.moveTo(-s*0.15,-s*0.05); g.lineTo(s*0.15,-s*0.05); g.lineTo(0, s*0.14); g.closePath(); g.fill();
  // optional accessory for parents
  if (opts.accessory === 'glasses'){
    g.strokeStyle = '#2a2a2a'; g.lineWidth = s*0.05;
    g.beginPath(); g.arc(-s*0.24,-s*0.3,s*0.16,0,Math.PI*2); g.stroke();
    g.beginPath(); g.arc(s*0.24,-s*0.3,s*0.16,0,Math.PI*2); g.stroke();
    g.beginPath(); g.moveTo(-s*0.08,-s*0.3); g.lineTo(s*0.08,-s*0.3); g.stroke();
  } else if (opts.accessory === 'iceCrown'){
    const tt = Date.now()/1000;
    g.save(); g.globalCompositeOperation = 'lighter';
    g.fillStyle = `rgba(150,230,255,${0.14+0.06*Math.sin(tt*3)})`; g.beginPath(); g.arc(0,-s*0.1,s*0.95,0,Math.PI*2); g.fill(); g.restore();
    g.fillStyle = 'rgba(225,250,255,0.95)';
    [[-0.24,-0.98,-0.34,-1.22,-0.1,-1.0],[0,-1.02,0,-1.34,0.1,-1.02],[0.24,-0.98,0.34,-1.22,0.1,-1.0]].forEach(([a,b,c,d,e,f])=>{
      g.beginPath(); g.moveTo(s*a-s*0.05,s*b); g.lineTo(s*c,s*d); g.lineTo(s*e,s*f); g.closePath(); g.fill(); });
    g.fillStyle = 'rgba(255,255,255,0.8)';
    for (let i=0;i<4;i++){ const a = tt*1.2+i*1.6; g.beginPath(); g.arc(Math.cos(a)*s*0.78,Math.sin(a)*s*0.55-s*0.1,s*0.03,0,Math.PI*2); g.fill(); }
  } else if (opts.accessory === 'flameCrest'){         // Raphidash: a live flame crest and drifting embers
    const tt = Date.now()/1000;
    g.save(); g.globalCompositeOperation = 'lighter';

  g.beginPath(); g.ellipse(-s*0.42*facing, s*0.16, s*0.11, s*0.24, 0.15*facing, 0, Math.PI*2); g.fill();

function drawCueio(g,x,y,s,facing){

  g.beginPath(); g.ellipse(-s*0.42*facing,s*0.22,s*0.1,s*0.2,0.3*facing,0,Math.PI*2); g.fill();
  g.fillStyle = volumeGrad(g,s*0.42*facing,s*0.14,s*0.14,lighten(fur,35),fur);

  g.fillRect(-s*0.045,s*0.02,s*0.04,s*0.06);
  g.fillRect(s*0.005,s*0.02,s*0.04,s*0.06);
  g.strokeStyle = '#d8c8b0'; g.lineWidth = s*0.008;
  g.strokeRect(-s*0.045,s*0.02,s*0.04,s*0.06);

  }

  g.beginPath(); g.ellipse(-s*0.55,-s*0.08,s*0.26,s*0.22,0,0,Math.PI*2); g.fill();

  g.beginPath(); g.ellipse(-s*0.46,-s*0.1,s*0.05,s*0.03,0,0,Math.PI*2); g.fill();
  g.restore();
}

function handleInteractKey(){
  if (battle){ battleAttack(); return; }
  if (dialogueActive){ advanceDialogue(); return; }
  if (sceneLocked || !currentScene) return;
  const pRect = {x:player.x, y:player.y, w:player.w, h:player.h};
  for (const npc of (currentScene.npcs||[])){

    }

let stepTimer = 0;
function updateExploration(dt){
  if (dialogueActive || sceneLocked || !currentScene) return;
  if (currentScene.tick && !battle) currentScene.tick();
  if (dialogueActive || sceneLocked) return;       // a tick may have started a dialogue or moved us to another scene
  let dx=0, dy=0;
  if (keys['arrowleft']||keys['a']) dx -= 1;
  if (keys['arrowright']||keys['d']) dx += 1;
  if (keys['arrowup']||keys['w']) dy -= 1;
  if (keys['arrowdown']||keys['s']) dy += 1;
  let moveSpeed = player.speed;
  if (player.dashT > 0){          // mid-dash: locked into the dash direction, very fast, leaving afterimages
    dx = player.dashDX; dy = player.dashDY; moveSpeed = 800; player.dashT -= dt;
    fxAfter.push({ x:player.x, y:player.y, type:player.type, life:0.24 });
  }
  if (dx||dy){
    const len = Math.hypot(dx,dy); dx/=len; dy/=len;
    player.facing = dx < 0 ? -1 : (dx>0 ? 1 : (player.facing||1));
    const step = Math.min(moveSpeed*dt, 24);   // never hop further than a thin pillar in one frame
    const nx = player.x + dx*step;
    const ny = player.y + dy*step;
    const tryRect = {x:nx, y:player.y, w:player.w, h:player.h};
    let moved = false;
    if (!(currentScene.obstacles||[]).some(o=>rectsOverlap(tryRect,o))){ player.x = clampX(nx); moved = true; }
    const tryRect2 = {x:player.x, y:ny, w:player.w, h:player.h};
    if (!(currentScene.obstacles||[]).some(o=>rectsOverlap(tryRect2,o))){ player.y = clampY(ny); moved = true; }
    if (moved){
      stepTimer -= dt;
      if (stepTimer <= 0){ sfxStep(); stepTimer = 0.28; }
    }
  } else {
    stepTimer = 0;
  }
  if (followers.length){
    followerTrail.unshift({x:player.x, y:player.y});
    const maxLen = (followers.length+1)*FOLLOWER_SPACING + 4;
    if (followerTrail.length > maxLen) followerTrail.length = maxLen;
  }
  if (battle) return; // fighting on top of this room — exits/interact stay off until the battle ends
  // exits
  const pRect = {x:player.x, y:player.y, w:player.w, h:player.h};
  for (const ex of (currentScene.exits||[])){
    if (rectsOverlap(pRect, ex)){ mapExitDir = exitDir(ex); ex.onEnter(); mapExitDir = null; return; }
  }
  // interact hint
  let showHint = false;
  for (const npc of (currentScene.npcs||[])){
    if (rectsOverlap(expand(pRect,14), npc)){ showHint = true; break; }
  }
  hintEl.style.display = showHint ? 'block' : 'none';
  hintEl.textContent = '␣ interagir';
}
function clampX(v){ return Math.max(20, Math.min(W-20-player.w, v)); }
function clampY(v){ return Math.max(70, Math.min(H-20-player.h, v)); }

fxFlashCanvas.width = fxFlashCanvas.height = 360;
const fxFlashCtx = fxFlashCanvas.getContext('2d');

const fxVignette = document.createElement('canvas');
fxVignette.width = W; fxVignette.height = H;
(function(){
  const g = fxVignette.getContext('2d');
  const gr = g.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.85);

})();
function fxQuality(){ return settings.quality === 'baixa' ? 0 : (settings.quality === 'media' ? 0.5 : 1); }
function fxBurst(x,y,n,color,speed,size,life,grav){
  const q = fxQuality(); if (q === 0) n = Math.ceil(n*0.3); else n = Math.ceil(n*q);
  for (let i=0;i<n && fxParticles.length<320;i++){
    const a = Math.random()*Math.PI*2, sp = speed*(0.35+Math.random()*0.65);
    fxParticles.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - speed*0.2, life:life*(0.6+Math.random()*0.4), max:life,
      size:size*(0.6+Math.random()*0.8), color, grav:grav||0 });

}
function fxShakeNow(sec, mag){ if (fxQuality() === 0) return; fxShake = Math.max(fxShake, sec); fxShakeMag = Math.max(fxShakeMag, mag); }
function updateFx(dt){
  for (let i=fxParticles.length-1;i>=0;i--){
    const p = fxParticles[i];
    p.life -= dt;
    if (p.life <= 0){ fxParticles.splice(i,1); continue; }
    p.vy += p.grav*dt; p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= (1 - 1.5*dt);
  }
  if (fxShake > 0){ fxShake -= dt; if (fxShake <= 0){ fxShake = 0; fxShakeMag = 0; } }
  if (fxPlayerHit > 0) fxPlayerHit = Math.max(0, fxPlayerHit - dt);
  for (let i=fxTexts.length-1;i>=0;i--){ const t = fxTexts[i]; t.life -= dt; t.y -= 46*dt; if (t.life <= 0) fxTexts.splice(i,1); }
  for (let i=fxSlashes.length-1;i>=0;i--){ fxSlashes[i].life -= dt; if (fxSlashes[i].life <= 0) fxSlashes.splice(i,1); }
  for (let i=fxAfter.length-1;i>=0;i--){ fxAfter[i].life -= dt; if (fxAfter[i].life <= 0) fxAfter.splice(i,1); }
  fxZoom *= Math.max(0, 1 - 9*dt); if (fxZoom < 0.001) fxZoom = 0;
  fxWhite = Math.max(0, fxWhite - 2.6*dt);
  fxSpeed = Math.max(0, fxSpeed - dt); fxDim = Math.max(0, fxDim - dt);
  player.dashCd = Math.max(0, player.dashCd - dt);
}
function fxDrawSlashes(g){
  g.save(); g.globalCompositeOperation = 'lighter';

    const k = 1 - s.life/s.max, a = s.life/s.max, L = s.len*(0.35 + 0.65*Math.min(1,k*3.2));
    g.save(); g.translate(s.x,s.y); g.rotate(s.ang);
    g.fillStyle = `rgba(${s.color},${(0.55*a).toFixed(3)})`;      // coloured outer glow, tapered like a crescent
    g.beginPath(); g.moveTo(-L,0); g.quadraticCurveTo(0,-L*0.3,L,0); g.quadraticCurveTo(0,-L*0.08,-L,0); g.fill();
    g.fillStyle = `rgba(255,255,255,${(0.95*a).toFixed(3)})`;     // hot white core
    g.beginPath(); g.moveTo(-L*0.86,0); g.quadraticCurveTo(0,-L*0.17,L*0.86,0); g.quadraticCurveTo(0,-L*0.04,-L*0.86,0); g.fill();
    g.restore();
  });

}
function fxDrawTexts(g){

// manga-style radial speed lines converging on the centre, plus a darkened backdrop
function fxDrawSpeed(g, t){
  if (fxDim > 0){ g.fillStyle = `rgba(0,0,20,${Math.min(0.45,fxDim*0.6).toFixed(3)})`; g.fillRect(0,0,W,H); }
  if (fxSpeed <= 0 || fxQuality() === 0) return;
  g.save(); g.strokeStyle = `rgba(255,255,255,${Math.min(0.75,fxSpeed*2.4).toFixed(3)})`; g.lineCap = 'round';
  for (let i=0;i<46;i++){
    const a = fxRand(i,7)*Math.PI*2 + t*0.6, r0 = H*0.3 + fxRand(i,8)*90, r1 = r0 + H*0.35 + fxRand(i,9)*160;
    g.lineWidth = 1 + fxRand(i,10)*2.6;
    g.beginPath(); g.moveTo(W/2+Math.cos(a)*r0, H/2+Math.sin(a)*r0); g.lineTo(W/2+Math.cos(a)*r1, H/2+Math.sin(a)*r1); g.stroke();

function fxDrawParticles(g){
  g.save(); g.globalCompositeOperation = 'lighter';
  fxParticles.forEach(p=>{
    const k = Math.max(0, p.life/p.max);
    g.fillStyle = `rgba(${p.color},${(0.85*k).toFixed(3)})`;

// stateless drifting ambience — position is a pure function of time, so it costs no per-frame bookkeeping
function fxRand(i,k){ const v = Math.sin(i*127.1 + k*311.7)*43758.5453; return v - Math.floor(v); }
function fxAmbient(g, cfg, t){
  const q = fxQuality(); if (q === 0 || !cfg || !cfg.kind) return;
  const n = Math.round((cfg.count||24)*q), col = cfg.color || '255,240,210';
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let i=0;i<n;i++){
    const r1 = fxRand(i,1), r2 = fxRand(i,2), r3 = fxRand(i,3);
    let x, y, a, s;
    if (cfg.kind === 'embers'){          // rise, sway, fade with height
      const cyc = (t*(22+r3*34) + r2*(H+60)) % (H+60);
      y = H + 20 - cyc; x = r1*W + Math.sin(t*1.3 + i)*16;
      a = Math.min(1, cyc/80) * Math.max(0, 1 - cyc/(H+40)) * 0.9; s = 1.2 + r3*2.2;
    } else if (cfg.kind === 'fireflies'){ // wander and blink
      x = r1*W + Math.sin(t*0.5 + i*2)*46; y = r2*H*0.85 + H*0.1 + Math.cos(t*0.4 + i)*34;
      a = Math.max(0, Math.sin(t*1.7 + i*3.1))*0.9; s = 1.6 + r3*1.6;
      g.fillStyle = `rgba(${col},${(a*0.25).toFixed(3)})`;
      g.beginPath(); g.arc(x,y,s*3.2,0,Math.PI*2); g.fill();
    } else {                              // dust: slow float
      x = (r1*W + t*(3+r3*5)) % W; y = r2*H + Math.sin(t*0.35 + i*1.7)*18;
      a = 0.12 + 0.2*Math.abs(Math.sin(t*0.6 + i)); s = 0.9 + r3*1.6;
    }
    g.fillStyle = `rgba(${col},${a.toFixed(3)})`;

}
// flickering additive light pools (torches, lamps, glowing windows) and soft god-ray shafts
function fxLights(g, lights, t){

      gr.addColorStop(0,`rgba(${L.c},${0.2*fl})`); gr.addColorStop(1,`rgba(${L.c},0)`);
      g.fillStyle = gr; g.beginPath();
      g.moveTo(L.x-L.w/2,L.y); g.lineTo(L.x+L.w/2,L.y);
      g.lineTo(L.x+L.w*1.2,L.y+L.len); g.lineTo(L.x-L.w*1.2,L.y+L.len); g.closePath(); g.fill();
    } else {
      const gr = g.createRadialGradient(L.x,L.y,0,L.x,L.y,L.r*fl);
      gr.addColorStop(0,`rgba(${L.c},${0.38*fl})`); gr.addColorStop(1,`rgba(${L.c},0)`);
      g.fillStyle = gr; g.beginPath(); g.arc(L.x,L.y,L.r*fl,0,Math.PI*2); g.fill();
    }
  });
  g.restore();
}
// ground mist: two slow, wide translucent bands
function fxMist(g, color, t, y, alpha){
  if (fxQuality() === 0) return;
  const R = W*0.42;
  for (let i=0;i<2;i++){
    const cx = ((t*(10+i*7) + i*W*0.55) % (W*1.6)) - W*0.3;
    const gr = g.createRadialGradient(0,0,0,0,0,R);
    gr.addColorStop(0,`rgba(${color},${alpha})`); gr.addColorStop(1,`rgba(${color},0)`);
    g.save(); g.translate(cx, y+i*14); g.scale(1,0.22); g.fillStyle = gr;
    g.fillRect(-R,-R,R*2,R*2); g.restore();
  }
}

function renderScene(){
  ctx.clearRect(0,0,W,H);
  if (!currentScene) return;
  const tSec = Date.now()/1000;
  const sfx = currentScene.fx || SCENE_FX.get(currentScene.draw) || { ambient:{kind:'dust',count:18} };
  ctx.save();
  if (fxShake > 0){ const m = fxShakeMag*(fxShake > 0.2 ? 1 : fxShake/0.2); ctx.translate((Math.random()-0.5)*2*m,(Math.random()-0.5)*2*m); }
  if (fxZoom > 0.001){ ctx.translate(W/2,H/2); ctx.scale(1+fxZoom,1+fxZoom); ctx.translate(-W/2,-H/2); }   // camera punch-in
  currentScene.draw(ctx);
  if (sfx.decor) sfx.decor(ctx, tSec);
  if (sfx.lights) fxLights(ctx, sfx.lights, tSec);
  if (battle) drawHazards(ctx, tSec);
  for (const npc of (currentScene.npcs||[])){
    const draw = DRAW[npc.type];
    if (draw) draw(ctx, npc.x+npc.w/2, npc.y+npc.h/2, npc.scale||34, npc.talking);
    if (npc.label){
      ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.font='11px sans-serif'; ctx.textAlign='center';
      ctx.fillText(npc.label, npc.x+npc.w/2, npc.y - 8);
    }
  }
  if (!battle){
    followers.forEach((type,i)=>{
      const sample = followerTrail[Math.min(followerTrail.length-1, (i+1)*FOLLOWER_SPACING)];
      if (!sample) return;
      const draw = DRAW[type];
      if (draw) draw(ctx, sample.x+player.w/2, sample.y+player.h/2, PLAYER_SCALE[type]||34, false);
    });
  }
  // dash afterimages: fading cyan-tinted ghosts of the sprite along the dash path
  fxAfter.forEach(a=>{
    ctx.save(); ctx.globalAlpha = 0.42*(a.life/0.24);
    const dr = DRAW[a.type];
    if (dr) dr(ctx, a.x+player.w/2, a.y+player.h/2, PLAYER_SCALE[a.type]||34, false);
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.22*(a.life/0.24); ctx.fillStyle = '#5fe6ff';
    ctx.beginPath(); ctx.arc(a.x+player.w/2, a.y+player.h/2, 24, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  });
  if (fxPlayerHit > 0 && Math.floor(fxPlayerHit*22) % 2 === 0) ctx.globalAlpha = 0.45;   // blink after a hit
  else if (battle && battle.iframes > 0 && player.dashT > 0) ctx.globalAlpha = 0.7;
  if (progress.form !== 'normal' && player.type === progress.main && (currentScene.isOpenWorld || (battle && battle.mods))) drawFormAura(ctx, player.x+player.w/2, player.y+player.h/2, progress.form, tSec);
  DRAW[player.type](ctx, player.x+player.w/2, player.y+player.h/2, PLAYER_SCALE[player.type]||34, false);
  ctx.globalAlpha = 1;
  if (battle){
    const ex = battle.enemyPos.x, ey = battle.enemyPos.y, base = battle.enemy.scale||52;
    const pdx = (player.x+player.w/2)-ex, pdy = (player.y+player.h/2)-ey, pd = Math.hypot(pdx,pdy)||1;
    // telegraph: melee enemies rear back and lunge just before swinging; ranged ones charge a glowing orb
    let wind = 0;
    if (battle.ranged){ if (battle.enemyAtkCd > 0 && battle.enemyAtkCd < 0.45) wind = 1 - battle.enemyAtkCd/0.45; }
    else if (pd < 85 && battle.enemyAtkCd > 0 && battle.enemyAtkCd < 0.32) wind = 1 - battle.enemyAtkCd/0.32;
    if (battle.act) wind = Math.max(wind, battle.actWind||0);      // special moves have their own longer wind-up
    const lift = battle.enemyLift || 0;
    if (lift > 0){ ctx.save(); ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(ex,ey+base*0.7,base*0.5*(1-lift/200),base*0.12,0,0,Math.PI*2); ctx.fill(); ctx.restore(); }
    if (wind > 0){
      const rc = battle.ranged ? (battle.enemy.projColor||'#ff5f3a') : '#ff5040';
      ctx.save(); ctx.strokeStyle = rc; ctx.globalAlpha = 0.55*wind; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(ex,ey,base*(1.15-0.35*wind),0,Math.PI*2); ctx.stroke();
      if (battle.ranged){ ctx.globalAlpha = 0.45*wind; ctx.fillStyle = rc; ctx.beginPath(); ctx.arc(ex,ey,base*0.3*wind,0,Math.PI*2); ctx.fill(); }
      ctx.restore();
    }
    const lunge = battle.ranged ? 0 : wind*9;
    // draw the enemy on an offscreen canvas so a hit can flash the whole sprite white
    fxFlashCtx.clearRect(0,0,360,360);
    fxRage = battle.rageTriggered ? 1 : 0;
    DRAW[battle.enemy.type](fxFlashCtx, 180, 180, base*(1+0.1*wind));
    fxRage = 0;
    if (battle.enemyFlash > 0){
      fxFlashCtx.globalCompositeOperation = 'source-atop';
      fxFlashCtx.fillStyle = `rgba(255,255,255,${(Math.min(1,battle.enemyFlash/0.16)*0.85).toFixed(3)})`;
      fxFlashCtx.fillRect(0,0,360,360);
      fxFlashCtx.globalCompositeOperation = 'source-over';
    }
    ctx.drawImage(fxFlashCanvas, ex-180+(pdx/pd)*lunge, ey-180+(pdy/pd)*lunge-lift);
    battle.projectiles.forEach(pr=>{
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = pr.color; ctx.globalAlpha = 0.25; ctx.beginPath(); ctx.arc(pr.x,pr.y,pr.r*2.4,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha = 0.18; ctx.beginPath(); ctx.arc(pr.x-pr.vx*0.02,pr.y-pr.vy*0.02,pr.r*1.6,0,Math.PI*2); ctx.fill();
      ctx.restore();
      ctx.fillStyle = pr.color; ctx.beginPath(); ctx.arc(pr.x,pr.y,pr.r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.arc(pr.x,pr.y,pr.r*0.5,0,Math.PI*2); ctx.fill();
    });
  }
  fxDrawParticles(ctx);
  fxDrawSlashes(ctx);
  fxDrawTexts(ctx);
  ctx.restore();
  // screen-wide finishing: colour grade, drifting ambience, soft dark edges
  if (sfx.tint && fxQuality() > 0){ ctx.fillStyle = sfx.tint; ctx.fillRect(0,0,W,H); }
  fxAmbient(ctx, sfx.ambient, tSec);
  if (fxQuality() > 0) ctx.drawImage(fxVignette, 0, 0);
  fxDrawSpeed(ctx, tSec);
  if (fxWhite > 0.01){ ctx.fillStyle = `rgba(255,255,255,${Math.min(0.9,fxWhite).toFixed(3)})`; ctx.fillRect(0,0,W,H); }
  if (battle) drawBattleHud(ctx, tSec);
  else if (currentScene.isOpenWorld) drawMiniMap(ctx);
  else drawChapterMiniMap(ctx);
  if (mapOpen && !battle) drawBigMap(ctx);
}

/* ---------------- battle system (real-time arena) ---------------- */
const battleOverlay = document.getElementById('battleOverlay');
const battleTitle = document.getElementById('battleTitle');
const battleToastEl = document.getElementById('battleToast');
const battleActions = document.getElementById('battleActions');

let battle = null;
let toastTimer = null;

function toast(msg){
  battleToastEl.textContent = msg;
  battleToastEl.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ battleToastEl.style.opacity = '0'; }, 2200);
}
function refreshHpUI(){
  const p = battle.player, e = battle.enemy;
  document.getElementById('battlePlayerName').textContent = p.name;
  document.getElementById('battlePlayerHpText').textContent = `${Math.max(0,p.hp)}/${p.maxHp}`;
  document.getElementById('battlePlayerHpBar').style.width = Math.max(0,p.hp/p.maxHp*100)+'%';
  document.getElementById('battleEnemyName').textContent = e.name;
  document.getElementById('battleEnemyHpText').textContent = `${Math.max(0,e.hp)}/${e.maxHp}`;
  document.getElementById('battleEnemyHpBar').style.width = Math.max(0,e.hp/e.maxHp*100)+'%';
}
function rnd(a,b){ return Math.round(a + Math.random()*(b-a)); }

// config: title, intro, player, enemy, secondary?, allyAssist?, fleeChance?, ranged?,
//         guaranteedDefeatAfterTurns? (now: force defeat after taking this many hits), scriptedDefeatMsg?,
//         onVictory, onDefeat, onFlee?
// The fight plays out on top of whatever room is already on screen — no separate arena backdrop.
function startBattle(config){
  battle = config;
  scaleEnemyForDifficulty(battle.enemy);
  // the Emerald of Elements is a real power-up: +40 attack for the whole party in every fight
  if (upgrades.elementalEmerald){
    battle.player.atk += 40;
    if (battle.secondary) battle.secondary.atk += 40;
  }
  // wave battles: config.waves = [{enemy, ranged}, ...] follow the first enemy in the same fight
  battle.waveNum = 1; battle.totalWaves = 1 + (battle.waves ? battle.waves.length : 0);
  battle.hitsTaken = 0;
  battle.secondaryUsed = false;
  battle.projectiles = [];
  battle.playerAtkCd = 0;
  battle.allyCd = 0;
  battle.fleeCd = 0;
  battle.enemyAtkCd = 0.9;
  battle.enemyFlash = 0;
  battle.rageTriggered = false;
  // anime-combat state
  battle.combo = 0; battle.comboT = 0;          // consecutive hits within a short window
  battle.special = 0; battle.specialT = 0; battle.specialStep = 0;   // power gauge + cinematic special move
  battle.iframes = 0; battle.dashStrikeT = 0;   // invulnerability window / bonus for attacking right after a dash
  battle.hazards = []; battle.act = null; battle.actWind = 0; battle.enemyLift = 0;   // enemy special moves in progress
  battle.moveCd = 4.2; battle.introT = 1.25; battle.introMax = 1.25;    // time until the enemy's first special move / intro banner clock
  fxHitStop = 0;

  player.type = battle.player.type;
  const px = player.x+player.w/2, py = player.y+player.h/2;
  const ex = Math.max(80, Math.min(W-80, px + (px < W/2 ? 220 : -220)));
  const ey = Math.max(100, Math.min(H-80, py));
  battle.enemyPos = { x: ex, y: ey };
  sceneLocked = false;

  battleTitle.textContent = config.title;
  toast(config.intro);
  refreshHpUI();
  battleActions.innerHTML = '';
  const mkBtn = (label, fn) => {
    const b = document.createElement('button');
    b.className = 'battleBtn'; b.textContent = label;
    b.onclick = fn; battleActions.appendChild(b); return b;
  };
  mkBtn(config.playerRanged ? '🚀 Atirar' : '⚔ Atacar', battleAttack);
  if (config.allyAssist) mkBtn('🤝 Huggy ajuda!', battleAllyAssist);
  mkBtn('🏃 Fugir', battleFlee);
  document.getElementById('battleHint').textContent = config.playerRanged
    ? 'setas/WASD andar · espaço atirar · Shift dash · K golpe especial'
    : 'setas/WASD andar · espaço atacar · Shift dash · K golpe especial';

  battleOverlay.style.display = 'flex';
  battleAttackBtn.style.display = 'flex';
  battleSpecialBtn.style.display = 'flex';
  battleAttackBtn.textContent = config.playerRanged ? '🚀' : '⚔';
  refreshSpecialUI();
}

// juice: white flash on the sprite, a spray of sparks and a small screen kick on every landed hit
function fxEnemyHit(power){
  if (!battle) return;
  const big = power > 1;
  battle.enemyFlash = 0.16;
  fxBurst(battle.enemyPos.x, battle.enemyPos.y, big?22:10, battle.enemy.hitColor||'255,230,160', big?260:170, 2.8, 0.5, 140);
  fxShakeNow(big?0.16:0.08, big?4:2);
}
function endBattleArena(outcome){

  battleSpecialBtn.style.display = 'none';

  player.dashT = 0;

    fxBurst(cfg.enemyPos.x, cfg.enemyPos.y, 48, '255,210,130', 330, 3.6, 0.95, 170);
    fxBurst(cfg.enemyPos.x, cfg.enemyPos.y, 24, cfg.enemy.hitColor||'255,120,90', 200, 4.4, 1.1, 120);

function battleAttack(){
  if (!battle || battle.playerAtkCd > 0) return;
  const px = player.x+player.w/2, py = player.y+player.h/2;
  const dmg = rnd(battle.player.atk-3, battle.player.atk+3);

    battle.playerAtkCd = 0.55;

    const d = Math.hypot(dx,dy) || 1;
    battle.projectiles.push({
      x:px, y:py, vx:(dx/d)*520, vy:(dy/d)*520, r:6,
      color: battle.playerProjColor || '#7dffb0', life:2, target:'enemy', dmg

  }
  if (battle.specialT > 0 || battle.introT > 0) return;

}
function battleAllyAssist(){

function battleTakeDamage(dmg){

// wave battles: the next monster is thrown into the same fight, the player keeps their HP (plus a small breather)

function tryDash(){

function updateSpecial(dt){
  const marks = [0.85, 0.68, 0.52, 0.36, 0.2, 0.05];
  battle.specialT -= dt;
  while (battle && battle.specialStep < marks.length && battle.specialT <= marks[battle.specialStep]){
    const last = battle.specialStep === marks.length-1;
    const dmg = Math.round(battle.player.atk*(last ? 2.2 : 0.95)*(0.9 + Math.random()*0.2));
    const ang = battle.specialStep*0.9 + Math.random()*0.4 - 1.2;

    if (last){ fxZoom = 0.09; fxWhite = 0.7; fxShakeNow(0.35, 8); }
    fxSlash(battle.enemyPos.x, battle.enemyPos.y, ang, last ? 200 : 145, last ? '255,220,120' : '160,230,255');
    if (hitEnemy(dmg, { heavy:true, ang, noGauge:true, stop:0.03 }) || !battle) return true;

function updateAct(dt, px, py){

function updateHazards(dt, px, py){

function updateBattle(dt){
  if (!battle) return;
  const b = battle;
  b.playerAtkCd = Math.max(0, b.playerAtkCd - dt);
  battleAttackBtn.disabled = b.playerAtkCd > 0;
  b.allyCd = Math.max(0, b.allyCd - dt);
  b.fleeCd = Math.max(0, b.fleeCd - dt);
  b.enemyAtkCd -= dt;
  b.enemyFlash = Math.max(0, b.enemyFlash - dt);
  b.iframes = Math.max(0, b.iframes - dt);
  b.dashStrikeT = Math.max(0, b.dashStrikeT - dt);
  b.comboT = Math.max(0, b.comboT - dt);
  if (b.introT > 0) b.introT -= dt;

  const px = player.x+player.w/2, py = player.y+player.h/2;
  const ex = b.enemyPos.x, ey = b.enemyPos.y;
  const dx = px-ex, dy = py-ey;
  const dist = Math.hypot(dx,dy) || 1;

  // arena items: touching one detonates it
  if (b.envItems){
    for (const it of b.envItems){
      if (it.used || Math.hypot(px-it.x, py-it.y) > 34) continue;
      it.used = true;
      fxBurst(it.x, it.y, 34, '255,170,60', 320, 3.6, 0.8, 120); fxShakeNow(0.3, 7); sfxSlam();
      fxText(it.x, it.y-40, it.label || 'BOOM!', '#ff9a3a', 34, 1.1);
      if (hitEnemy(Math.round(b.enemy.maxHp*it.pct), { heavy:true, noGauge:true, stop:0.12 }) || !battle) return;
    }
  }

  // phase 2: below half health the enemy gets enraged — faster, quicker to strike, and looks it
  if (!b.rageTriggered && b.enemy.hp > 0 && b.enemy.hp <= b.enemy.maxHp*0.5){
    b.rageTriggered = true;
    toast(`${b.enemy.name} está furioso!`);
    fxShakeNow(0.4, 7);
    fxBurst(ex, ey, 34, '255,90,50', 280, 3.4, 0.8, -40);
    flash('#ff6a2a');
  }
  const rage = b.rageTriggered;
  // ambient aura particles: embers off the titan, sparks off the turret, wisps off the shadow beast…
  const AURA = { titan:['255,140,50',16], armaGuardia:['255,170,60',12], shadowPredator:['160,110,255',14],
                 drone:['200,120,255',6], hunter:['255,60,80',5], predator:['255,90,60',8], giant:['255,110,40',22], hydra:['120,255,160',12],
                 smiler:['255,250,190',12], faceless:['200,200,210',7], crawler:['255,230,70',9], ortsa:['255,50,100',14], wordDevourer:['200,150,255',20], universeDevourer:['255,80,240',26] };
  const au = AURA[b.enemy.type];
  if (au && fxQuality() > 0 && Math.random() < au[1]*(rage?2:1)*dt && fxParticles.length < 300){
    fxParticles.push({ x:ex+(Math.random()-0.5)*44, y:ey+(Math.random()-0.5)*34, vx:(Math.random()-0.5)*34,
      vy:-26-Math.random()*34, life:0.9, max:0.9, size:2+Math.random()*2, color:au[0], grav:0 });
  }

  const frozen = b.introT > 0 || b.specialT > 0;   // enemy holds still during the intro banner and the player's special
  if (b.specialT > 0 && updateSpecial(dt)) return;
  if (!battle) return;
  updateHazards(dt, px, py);
  if (!battle) return;

  if (battle.act){
    updateAct(dt, px, py);
    if (!battle) return;
  } else if (!frozen){
    battle.moveCd -= dt;
    const list = ENEMY_MOVES[battle.enemy.type];
    if (list && battle.moveCd <= 0){
      startMove(list[Math.floor(Math.random()*list.length)], px, py);
    } else if (battle.ranged){
      if (dist < 230){ battle.enemyPos.x -= (dx/dist)*55*dt; battle.enemyPos.y -= (dy/dist)*55*dt; }
      battle.enemyPos.x = Math.max(70, Math.min(W-70, battle.enemyPos.x));
      battle.enemyPos.y = Math.max(100, Math.min(H-70, battle.enemyPos.y));
      if (battle.enemyAtkCd <= 0){
        battle.enemyAtkCd = rage ? 1.1 : 1.35;
        enemyShot(ex, ey, Math.atan2(dy,dx), 270, rnd(battle.enemy.atk-2, battle.enemy.atk+2));
      }
    } else {
      if (dist > (battle.enemy.reach||58)){
        const spd = (battle.enemy.speed || 105) * (rage ? 1.25 : 1);
        battle.enemyPos.x += (dx/dist)*spd*dt;
        battle.enemyPos.y += (dy/dist)*spd*dt;
      } else if (battle.enemyAtkCd <= 0){
        battle.enemyAtkCd = rage ? 0.95 : 1.15;
        battleTakeDamage(rnd(battle.enemy.atk-2, battle.enemy.atk+2));
        if (!battle) return;
      }
    }
  }

  for (let i = battle.projectiles.length-1; i >= 0; i--){
    const pr = battle.projectiles[i];
    if (pr.home){   // soul wisps curve toward the player
      const ax = px-pr.x, ay = py-pr.y, d = Math.hypot(ax,ay) || 1, k = Math.min(1, 2.2*dt);
      pr.vx += (ax/d*pr.sp - pr.vx)*k; pr.vy += (ay/d*pr.sp - pr.vy)*k;
    }
    pr.x += pr.vx*dt; pr.y += pr.vy*dt; pr.life -= dt;
    if (pr.target === 'enemy'){
      if (Math.hypot(pr.x-battle.enemyPos.x, pr.y-battle.enemyPos.y) < 30){
        battle.projectiles.splice(i,1);
        if (hitEnemy(pr.dmg, {}) || !battle) return;
        continue;
      }
    } else if (battle.iframes <= 0 && Math.hypot(pr.x-px, pr.y-py) < 24){
      battleTakeDamage(pr.dmg);
      if (!battle) return;
      battle.projectiles.splice(i,1);
      continue;
    }
    if (pr.life <= 0 || pr.x<-20 || pr.x>W+20 || pr.y<-20 || pr.y>H+20) battle.projectiles.splice(i,1);
  }
}

function drawRocketShip(g,x,y,s,launching){

  g.lineTo(-s*0.42,-s*0.2); g.quadraticCurveTo(-s*0.42,-s*0.6,0,-s*1.0);

// interdimensional hurricane: k = 0..1 storm intensity. A funnel of rotating rift-colored rings, lightning, debris, and monsters
// stepping out of the sky as it builds.
function drawHurricaneField(g, k, t){
  const sky = g.createLinearGradient(0,0,0,H);
  const lerp = (a,b)=> Math.round(a+(b-a)*k);
  sky.addColorStop(0,`rgb(${lerp(20,52)},${lerp(24,6)},${lerp(48,96)})`); sky.addColorStop(0.55,`rgb(${lerp(46,92)},${lerp(40,18)},${lerp(70,130)})`); sky.addColorStop(1,'#1a2a18');
  g.fillStyle = sky; g.fillRect(0,0,W,H);
  g.fillStyle = '#1e3320'; g.fillRect(0,H*0.62,W,H*0.38);                         // field
  g.strokeStyle = 'rgba(0,0,0,0.18)'; g.lineWidth = 2;
  for (let i=0;i<40;i++){ const x = fxRand(i,21)*W, y = H*0.64+fxRand(i,22)*H*0.34; g.beginPath(); g.moveTo(x,y); g.lineTo(x+3,y-9); g.stroke(); }
  // distant monsters step out of the rift as the storm peaks
  if (k > 0.5){
    const a = Math.min(1,(k-0.5)/0.5), kinds = ['drone','shadowPredator','predator','hunter','armaGuardia','titan','drone'];
    kinds.forEach((kd,i)=>{
      const x = 90 + i*(W-180)/6, y = H*0.6 + (i%2)*34 + fxRand(i,31)*20;
      g.save(); g.globalAlpha = a*0.9; if (DRAW[kd]) DRAW[kd](g, x, y, 24+ (kd==='titan'?10:0), false); g.restore();
    });
  }
  const cx = W/2, top = 70, bot = H*0.62;
  if (k > 0.02){
    // the funnel: stacked ellipses that narrow toward the ground, each spinning at its own phase
    const cols = ['122,60,255','0,229,255','255,60,240'];
    for (let i=0;i<22;i++){
      const u = i/21, y = top + u*(bot-top), w = 260*(1-u*0.86)*(0.35+0.65*k) + 14;
      const sway = Math.sin(t*1.7 + u*4)*22*k, c = cols[i%3];
      g.save(); g.translate(cx+sway,y); g.rotate(Math.sin(t*0.8+i)*0.05);
      g.strokeStyle = `rgba(${c},${(0.22+0.4*k).toFixed(3)})`; g.lineWidth = 4+ (1-u)*6*k;
      g.beginPath(); g.ellipse(0,0,w,w*0.16,0,0,Math.PI*2); g.stroke();
      g.fillStyle = `rgba(${c},${(0.05+0.08*k).toFixed(3)})`; g.fill();
      g.restore();
      // rotating spark on the ring
      const ang = t*(3 + (1-u)*3) + i; g.fillStyle = `rgba(255,255,255,${(0.5*k).toFixed(3)})`;
      g.beginPath(); g.arc(cx+sway+Math.cos(ang)*w, y+Math.sin(ang)*w*0.16, 2.2, 0, Math.PI*2); g.fill();
    }
    // rift glow at the top of the funnel
    const rg = g.createRadialGradient(cx,top,0,cx,top,190*(0.4+0.6*k));
    rg.addColorStop(0,`rgba(255,255,255,${0.6*k})`); rg.addColorStop(0.3,`rgba(180,100,255,${0.5*k})`); rg.addColorStop(1,'rgba(90,20,160,0)');
    g.fillStyle = rg; g.fillRect(0,0,W,H*0.6);
    // lightning
    const slot = Math.floor(t*5);
    if (k > 0.25 && fxRand(slot,41) > 0.72){
      g.strokeStyle = 'rgba(230,240,255,0.9)'; g.lineWidth = 3; g.beginPath();
      let lx = cx + (fxRand(slot,42)-0.5)*300, ly = top+20; g.moveTo(lx,ly);
      for (let i=0;i<7;i++){ lx += (fxRand(slot+i,43)-0.5)*70; ly += (bot-top)/7+10; g.lineTo(lx,ly); }
      g.stroke(); g.fillStyle = 'rgba(200,210,255,0.10)'; g.fillRect(0,0,W,H);
    }
    // debris orbiting the funnel
    g.fillStyle = 'rgba(30,20,20,0.85)';
    for (let i=0;i<26;i++){
      const u = fxRand(i,51), a = t*(1.4+fxRand(i,52)*1.6)+i, y = top + u*(bot-top), w = 200*(1-u*0.86)*k+20;
      g.save(); g.translate(cx+Math.cos(a)*w, y+Math.sin(a)*w*0.16); g.rotate(a*2); g.fillRect(-3,-2,6+fxRand(i,53)*6,4); g.restore();
    }
  }
}

const OW_ITEM_CACHE = {};
// four quadrants — the two central lanes (horizontal and vertical) are never used, so every exit stays reachable
const OW_QUADS = [[34,W/2-100,96,H/2-80],[W/2+100,W-34,96,H/2-80],[34,W/2-100,H/2+80,H-70],[W/2+100,W-34,H/2+80,H-70]];
function scatterItems(sa, sb, kinds, count, avoid, dimFn){
  const items = [];
  for (let i=0; i<count*3 && items.length<count; i++){
    const k = kinds[Math.floor(fxRand(sa*31+sb*17+i,11)*kinds.length)], d = dimFn(k,i);
    const q = OW_QUADS[i%4];
    const w = d[0], h = d[1];
    if (q[1]-q[0] < w+4 || q[3]-q[2] < h+4) continue;
    const x = Math.round(q[0] + fxRand(sa*31+sb*17+i,12)*(q[1]-q[0]-w));
    const y = Math.round(q[2] + fxRand(sa*31+sb*17+i,13)*(q[3]-q[2]-h));
    const r = {k, x, y, w, h, c:d[2]};
    if (avoid.some(a=> rectsOverlap(expand(r,10), a))) continue;
    if (items.some(o=> rectsOverlap(expand(r,8), o))) continue;
    items.push(r);
  }
  return items.sort((a,b)=> (a.y+a.h)-(b.y+b.h));
}
function owItems(ix,iy){
  const key = ix+','+iy;
  if (OW_ITEM_CACHE[key]) return OW_ITEM_CACHE[key];
  const b = owBiome(ix,iy), st = OW_STYLE[b];
  const lms = [{k:st.lm, ...OW_LM_BOX}];
  if (b === 'village') lms.push({k:'hut', ...OW_LM_BOX2, alt:true});
  const avoid = lms.map(l=>l).concat(OW_AVOID[key]||[]);
  const items = st.deco.length ? scatterItems(ix,iy,st.deco,9,avoid,k=>OW_DIM[k]) : [];
  return OW_ITEM_CACHE[key] = { lms, items };
}
function owDecor(ix,iy){       // collision rects: landmark bases + solid decor bases
  const { lms, items } = owItems(ix,iy), out = [];
  lms.forEach(l=> out.push({x:l.x+14, y:l.y+l.h*0.5, w:l.w-28, h:l.h*0.5}));
  items.forEach(o=>{ if (o.c) out.push({x:o.x+o.w*0.2, y:o.y+o.h*0.6, w:o.w*0.6, h:o.h*0.4}); });
  return out;
}

  g.fillStyle = 'rgba(80,190,255,0.35)'; g.beginPath(); g.ellipse(0,s*0.55,s*1.1,s*0.2,0,0,Math.PI*2); g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.6)'; g.lineWidth = 2; g.beginPath(); g.ellipse(0,s*0.55,s*0.9+Math.sin(t*2)*4,s*0.14,0,0,Math.PI*2); g.stroke();
  g.fillStyle = '#7a4a24'; g.beginPath(); g.moveTo(-s*0.8,s*0.1); g.lineTo(s*0.8,s*0.1); g.quadraticCurveTo(s*0.6,s*0.6,0,s*0.62); g.quadraticCurveTo(-s*0.6,s*0.6,-s*0.8,s*0.1); g.closePath(); g.fill();
  g.fillStyle = '#a0682f'; g.fillRect(-s*0.8,s*0.06,s*1.6,s*0.1);
  g.strokeStyle = '#4a2a10'; g.lineWidth = 4; g.beginPath(); g.moveTo(0,s*0.08); g.lineTo(0,-s*0.85); g.stroke();
  g.fillStyle = '#f4ecd8'; g.beginPath(); g.moveTo(s*0.04,-s*0.8); g.quadraticCurveTo(s*0.6+Math.sin(t*2)*3,-s*0.4,s*0.5,s*0.02); g.lineTo(s*0.04,s*0.02); g.closePath(); g.fill();
  g.fillStyle = '#ff5a5a'; g.beginPath(); g.moveTo(0,-s*0.85); g.lineTo(-s*0.3,-s*0.75); g.lineTo(0,-s*0.65); g.closePath(); g.fill();
  g.restore();
}
function drawAltarBase(g,x,y,s,done,kind){
  const t = Date.now()/1000, max = kind === 'max';
  g.save(); g.translate(x,y);
  groundShadow(g, s, s*0.8);
  g.fillStyle = '#8a8fa0'; g.beginPath(); g.moveTo(-s*0.6,s*0.8); g.lineTo(-s*0.44,s*0.3); g.lineTo(s*0.44,s*0.3); g.lineTo(s*0.6,s*0.8); g.closePath(); g.fill();
  g.fillStyle = '#b8bccb'; g.fillRect(-s*0.5,s*0.22,s,s*0.12);
  g.fillStyle = '#6a6f80'; g.fillRect(-s*0.36,s*0.5,s*0.72,s*0.06);
  const hue = max ? (t*90)%360 : 45, col = done ? 'rgba(160,160,170,0.5)' : (max ? `hsl(${hue},95%,68%)` : '#ffd54a');
  if (!done){ g.save(); g.globalCompositeOperation = 'lighter'; const rg = g.createRadialGradient(0,-s*0.15,0,0,-s*0.15,s*1.1); rg.addColorStop(0,max ? `hsla(${hue},95%,65%,0.5)` : 'rgba(255,210,60,0.5)'); rg.addColorStop(1,'rgba(255,210,60,0)'); g.fillStyle = rg; g.beginPath(); g.arc(0,-s*0.15,s*1.1,0,Math.PI*2); g.fill(); g.restore(); }
  const fl = done ? 0 : Math.sin(t*3)*s*0.05;
  g.fillStyle = col; g.beginPath(); g.moveTo(0,-s*0.62+fl); g.lineTo(s*0.24,-s*0.2+fl); g.lineTo(0,s*0.16+fl); g.lineTo(-s*0.24,-s*0.2+fl); g.closePath(); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.55)'; g.beginPath(); g.moveTo(0,-s*0.62+fl); g.lineTo(-s*0.24,-s*0.2+fl); g.lineTo(-s*0.06,-s*0.16+fl); g.closePath(); g.fill();
  if (max && !done){ g.font = `bold ${Math.round(s*0.3)}px sans-serif`; g.textAlign = 'center'; g.fillStyle = 'rgba(255,255,255,0.9)'; g.fillText('MAX', 0, s*0.52); }
  else if (!done){ g.font = `bold ${Math.round(s*0.26)}px sans-serif`; g.textAlign = 'center'; g.fillStyle = 'rgba(80,50,0,0.85)'; g.fillText('SUPER', 0, s*0.52); }
  g.restore();
}
function drawAltarSuper(g,x,y,s,done){ drawAltarBase(g,x,y,s,done,'super'); }

// Super: gold flames. Max: rainbow flames, a shifting ring and feathered wings — drawn behind the sprite of whoever leads the group
function drawFormAura(g,x,y,form,t){
  const max = form === 'max';
  g.save(); g.translate(x,y); g.globalCompositeOperation = 'lighter';
  const c1 = max ? '255,120,240' : '255,210,60', c2 = max ? '80,230,255' : '255,130,30', r = (max ? 58 : 46) + 5*Math.sin(t*6);
  const gr = g.createRadialGradient(0,-4,6,0,-4,r*1.5); gr.addColorStop(0,`rgba(${c1},0.5)`); gr.addColorStop(0.6,`rgba(${c2},0.24)`); gr.addColorStop(1,`rgba(${c2},0)`);
  g.fillStyle = gr; g.beginPath(); g.arc(0,-4,r*1.5,0,Math.PI*2); g.fill();
  const n = max ? 14 : 9;
  for (let i=0;i<n;i++){
    const u = (t*0.9+i/n)%1, px = Math.sin(i*2.4+t*2)*24, py = 24-u*90, sz = (1-u)*(max ? 8 : 7);
    g.fillStyle = max ? `hsla(${(i*40+t*120)%360},95%,65%,${(1-u)*0.85})` : `rgba(${i%2?c1:c2},${(1-u)*0.85})`;
    g.beginPath(); g.arc(px,py,sz,0,Math.PI*2); g.fill();
  }
  if (max){
    const flap = Math.sin(t*5)*0.18;
    [-1,1].forEach(sd=>{
      for (let k=0;k<5;k++){
        const a = -0.9+k*0.34+flap, len = 46+k*7;
        g.fillStyle = `hsla(${(k*50+t*80)%360},90%,78%,0.42)`;
        g.beginPath(); g.moveTo(sd*12,-8); g.quadraticCurveTo(sd*(14+Math.cos(a)*len*0.6),-8+Math.sin(a)*len*0.9,sd*(14+Math.cos(a)*len),-8+Math.sin(a)*len*0.5+10); g.quadraticCurveTo(sd*(10+Math.cos(a)*len*0.5),-2,sd*12,-2); g.closePath(); g.fill();
      }
    });
    g.strokeStyle = `hsla(${(t*160)%360},95%,70%,0.7)`; g.lineWidth = 2.5; g.beginPath(); g.ellipse(0,26,r*0.9,r*0.22,0,0,Math.PI*2); g.stroke();
  }
  g.restore();
}
function drawIsland(g,t,info){
  const sg = g.createLinearGradient(0,0,0,H); sg.addColorStop(0,'#2a5ac8'); sg.addColorStop(0.18,'#6ad4f0'); sg.addColorStop(1,'#1a8ab8');
  g.fillStyle = sg; g.fillRect(0,0,W,H);
  g.save(); g.globalCompositeOperation = 'lighter';       // aurora over the horizon
  for (let i=0;i<3;i++){ const ag = g.createLinearGradient(0,10,0,110); ag.addColorStop(0,'rgba(120,255,200,0)'); ag.addColorStop(0.5,`rgba(${i?'200,120,255':'120,255,200'},${0.22+0.08*Math.sin(t+i)})`); ag.addColorStop(1,'rgba(120,255,200,0)');
    g.fillStyle = ag; g.beginPath(); g.moveTo(0,60+i*10); for (let x=0;x<=W;x+=40) g.lineTo(x,60+i*12+Math.sin(x*0.01+t*0.8+i)*16); g.lineTo(W,110); g.lineTo(0,110); g.closePath(); g.fill(); }
  g.restore();
  g.fillStyle = 'rgba(255,250,220,0.8)'; g.beginPath(); g.arc(W*0.82,44,20,0,Math.PI*2); g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 2;
  for (let i=0;i<26;i++){ const x = (fxRand(i,120)*W + t*8*(1+i%3)) % W, y = 130+fxRand(i,121)*(H-130); g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x+9,y-4,x+18,y); g.stroke(); }
  const cx = W/2, cy = H/2+30;
  g.fillStyle = 'rgba(255,255,255,0.35)'; g.beginPath(); g.ellipse(cx,cy+8,452,232,0,0,Math.PI*2); g.fill();        // surf
  g.fillStyle = '#f0dc9a'; g.beginPath(); g.ellipse(cx,cy,430,214,0,0,Math.PI*2); g.fill();                       // sand
  const gg = g.createRadialGradient(cx,cy-30,20,cx,cy,360); gg.addColorStop(0,'#5ad07a'); gg.addColorStop(1,'#2a9a52');
  g.fillStyle = gg; g.beginPath(); g.ellipse(cx,cy-6,370,178,0,0,Math.PI*2); g.fill();                             // grass
  g.strokeStyle = 'rgba(255,240,170,0.5)'; g.lineWidth = 46; g.beginPath(); g.moveTo(cx,cy+178); g.lineTo(cx,cy+30); g.stroke();   // path from the boat
  g.lineWidth = 34; g.beginPath(); g.moveTo(cx-260,cy-40); g.lineTo(cx+260,cy-40); g.stroke();
  g.save(); g.translate(cx,cy-40); g.scale(1,0.4);                                                               // ring of runes
  g.strokeStyle = `rgba(255,240,150,${0.5+0.3*Math.sin(t*2)})`; g.lineWidth = 4; g.setLineDash([14,10]); g.lineDashOffset = -t*20; g.beginPath(); g.arc(0,0,120,0,Math.PI*2); g.stroke(); g.restore();
  ISLAND_ITEMS.forEach(o=> drawDeco(g,o.k,o.x,o.y,o.w,o.h,t,ISLAND_STYLE));
  if (info){
    const m = Math.floor(info.secs/60), s2 = String(Math.floor(info.secs%60)).padStart(2,'0');
    g.textAlign = 'center'; g.font = 'bold 14px sans-serif'; g.lineWidth = 4; g.strokeStyle = 'rgba(0,30,60,0.8)';
    const txt = info.open ? `A ilha afunda em ${m}:${s2}` : 'A ilha se foi...'; g.strokeText(txt,W/2,96); g.fillStyle = info.secs < 20 && info.open ? '#ffb0a0' : '#ffffff'; g.fillText(txt,W/2,96);
  }
}
const ISLAND_STYLE = { leaf:'#2fd06a', trunk:'#8a6a3a', rock:'#a8b0b8' };
const ISLAND_ITEMS = [
  {k:'palm',x:60,y:130,w:56,h:96}, {k:'palm',x:W-116,y:130,w:56,h:96}, {k:'palm',x:80,y:420,w:56,h:96}, {k:'palm',x:W-136,y:420,w:56,h:96},

function drawVoidPortal(g,x,y,s,found){   // the door to the final boss: a ring of dark stars around a swirling void
  const t = Date.now()/1000;
  g.save(); g.translate(x,y);
  g.save(); g.globalCompositeOperation = 'lighter'; const rg = g.createRadialGradient(0,0,s*0.2,0,0,s*1.5); rg.addColorStop(0,'rgba(200,80,255,0.4)'); rg.addColorStop(1,'rgba(200,80,255,0)'); g.fillStyle = rg; g.beginPath(); g.arc(0,0,s*1.5,0,Math.PI*2); g.fill(); g.restore();
  g.fillStyle = '#05010c'; g.beginPath(); g.ellipse(0,0,s*0.85,s,0,0,Math.PI*2); g.fill();
  g.strokeStyle = 'rgba(220,120,255,0.85)'; g.lineWidth = 3; g.beginPath(); g.ellipse(0,0,s*0.85,s,0,0,Math.PI*2); g.stroke();
  for (let arm=0;arm<3;arm++){ g.strokeStyle = arm===0 ? 'rgba(255,60,240,0.6)' : (arm===1 ? 'rgba(0,229,255,0.55)' : 'rgba(255,220,120,0.5)'); g.lineWidth = 2.5; g.beginPath();
    for (let u=0;u<=1;u+=0.06){ const a = arm*2.09+u*5+t*0.9, r = u*s*0.8; const px = Math.cos(a)*r*0.9, py = Math.sin(a)*r; if (u===0) g.moveTo(px,py); else g.lineTo(px,py); } g.stroke(); }
  g.fillStyle = '#fff'; for (let i=0;i<10;i++){ const a = t*0.3+i*0.63, r = s*0.7*fxRand(i,95); g.fillRect(Math.cos(a)*r*0.9,Math.sin(a)*r,1.8,1.8); }
  g.restore();
}

// story-mode party: whoever the player picked to lead is the main fighter; the next party member backs them up
let storyLead = 'duo', storyParty = ['duo','astro','huggy'];
function leadName(){ return ROSTER[storyLead].name; }
function setStoryParty(party, lead){
  storyLead = lead; storyParty = party.slice(); player.type = lead;
  followers = party.filter(id=> id !== lead); followerTrail.length = 0;
}
function pickLead(title, party, then){
  showEndingScreen({ title, text:'Quem vai na frente do grupo? Ele lidera na exploração e é o lutador principal; os outros vêm logo atrás e ajudam na luta.',
    buttons: party.map(id=>({ label: ROSTER[id].name + ' — ' + ROSTER[id].desc, fn:()=>{ endOverlay.classList.add('hidden'); setStoryParty(party, id); then(); } })) });
}
function storyPlayer(baseHp){
  const r = ROSTER[storyLead], hp = Math.round(baseHp*r.hp) + (upgrades.jewelOfLife?15:0);
  const atk = Math.round((9 + (upgrades.emeraldOfPower?10:0) + (upgrades.alienWeapon?20:0) + (upgrades.monsterEmerald?12:0))*r.atk);
  return { name:r.name, type:storyLead, hp, maxHp:hp, atk };
}
function storySecondary(baseHp){
  const id = storyParty.find(p=> p !== storyLead) || 'astro', r = ROSTER[id], hp = Math.round(baseHp*r.hp);
  return { name:r.name, type:id, hp, maxHp:hp, atk:Math.round(9*r.atk) };
}
function heroStats(baseHp){ return storyPlayer(baseHp); }
function makeWaveList(){   // waves that follow the first enemy in one continuous fight
  return [
    {enemy:{name:'Predador das Sombras',type:'shadowPredator',hp:150,maxHp:150,atk:10,speed:150}},

function buildChapter5(){
  followers = ['astro','huggy','cueio']; followerTrail.length = 0;
  let hurrStart = 0, hurrEnd = 0, stormTimer = null;
  const hurrK = ()=>{
    if (hurrEnd) return Math.max(0, 1 - (performance.now()-hurrEnd)/4000);
    return hurrStart ? Math.min(1, (performance.now()-hurrStart)/9000) : 0;
  };
  const stopStorm = ()=>{ if (stormTimer){ clearInterval(stormTimer); stormTimer = null; } };

  const field = {
    banner: 'CAPÍTULO 5 — O FURACÃO',
    draw: (g)=> drawHurricaneField(g, hurrK(), Date.now()/1000),
    obstacles: [], npcs: [], exits: [],
    fx: { ambient:{kind:'embers',count:44,color:'190,130,255'}, tint:'rgba(60,10,90,0.10)' },
    onEnter: ()=>{
      sceneLocked = true;
      startDialogue([
        {speaker:leadName(), text:'Finalmente fora do castelo... mas o ar está pesado.', color:'#7ef9ff'},
        {speaker:'Astro', text:'Meu sensor de energia enlouqueceu. Algo enorme está se formando.', color:'#8fffb0'},
        {speaker:'Huggy', text:'O céu... tá ficando roxo?', color:'#a9c9ff'},
        {speaker:'Cueio', text:'Eu conheço isso. No meu mundo chamamos de "A Fenda".', color:'#ffb066'},
      ], ()=> beginStorm());
    }
  };
  function beginStorm(){
    hurrStart = performance.now();
    stormTimer = setInterval(()=>{           // the storm rattles the whole screen and flashes with lightning
      if (currentScene !== field){ stopStorm(); return; }
      fxShakeNow(0.3, 2 + 5*hurrK());
      if (Math.random() < 0.15*hurrK()) fxWhite = Math.max(fxWhite, 0.45);
    }, 250);
    startDialogue([
      {speaker:'???', text:'*O vento uiva. Um redemoinho de luz roxa rasga o céu!*', color:'#c9a8ff'},
      {speaker:'Cueio', text:'É um FURACÃO INTERDIMENSIONAL! Ele arranca criaturas de outros mundos e joga aqui!', color:'#ffb066'},
      {speaker:leadName(), text:'Fiquem juntos! Não deixem ele nos levar!', color:'#7ef9ff'},
    ], ()=>{
      startDialogue([
        {speaker:'???', text:'*Silhuetas despencam do redemoinho... dezenas de monstros de todas as dimensões cercam vocês!*', color:'#ff9977'},
        {speaker:'Astro', text:'São muitos! Precisamos aguentar até a Fenda esgotar!', color:'#8fffb0'},
        {speaker:leadName(), text:'Sem recuar! Dash, ataque e golpe especial — todos juntos!', color:'#7ef9ff'},
      ], ()=> startFight());
    });
  }
  function startFight(){
    if (hurrK() < 1) hurrStart = performance.now() - 9000;
    startWaveFight({
      title:'O Furacão Interdimensional!', intro:'6 ondas de monstros — aguente firme!', hp:85,
      onVictory: ()=>{
        player.type = storyLead;
        hurrEnd = performance.now(); stopStorm(); fxWhite = 0.9; fxShakeNow(0.6, 8);
        startDialogue([
          {speaker:leadName(), text:'Acabou...? O redemoinho está encolhendo!', color:'#7ef9ff'},
          {speaker:'Cueio', text:'A Fenda está se fechando. Mas as criaturas que já caíram... elas ficaram por aqui.', color:'#ffb066'},
          {speaker:'Astro', text:'Então o mundo agora está cheio delas. E também de caminhos que antes não existiam.', color:'#8fffb0'},
          {speaker:'Huggy', text:'Quer dizer que a gente pode ir pra qualquer lugar? Explorar tudo?', color:'#a9c9ff'},
          {speaker:leadName(), text:'É isso. O mundo está aberto. Vamos!', color:'#7ef9ff'},
        ], ()=> endChapter5());
      },
      onDefeat: ()=>{
        player.type = storyLead;
        startDialogue([{speaker:leadName(), text:'Ainda tem monstro demais... levanta! Vamos tentar de novo!', color:'#7ef9ff'}], ()=> startFight());
      }
    });
  }
  return { start: ()=> pickLead('Capítulo 5 — Escolha o líder', ['duo','astro','huggy','cueio'], ()=> goToScene(field, {x:120,y:Math.round(H*0.7)})) };
}

let panelOpen = false, panelTab = 'up', checkingAch = false;

const panelTabs = document.getElementById('panelTabs');
const packBtn = document.getElementById('packBtn');
const FINAL_LEVEL = 50;
function xpNeed(lv){ return 10 + 2*lv; }
function grantXp(n){
  progress.xp += n;
  while (progress.xp >= xpNeed(progress.level) && progress.level < 99){
    progress.xp -= xpNeed(progress.level); progress.level++;
    showBanner(`⬆ Nível ${progress.level}!  (+3 vida, +1 ataque)`); sfxSpecial();
  }
  checkAchievements();
}
// everything the final boss demands: level 50 plus every emerald — the six challenge ones and the three story ones
function finalReady(){
  return progress.level >= FINAL_LEVEL && emeraldCount() >= 6 && upgrades.elementalEmerald && upgrades.disguiseEmerald && upgrades.monsterEmerald;
}
function unlockChar(id, msg){ if (!progress.chars[id]){ progress.chars[id] = true; showBanner('🧑 Novo personagem: '+msg+'!'); sfxPickup(); } }
function checkUnlocks(){
  if (progress.arenaWins >= 1) unlockChar('hunter','Caçador');
  if (emeraldCount() >= 3) unlockChar('king','Rei');
  if (progress.kills >= 20) unlockChar('totoziho','Totoziho');
  if (emeraldCount() >= 2) unlockChar('ice','Ice');
  if (progress.emeralds.crit) unlockChar('glard','Glard');
  if (progress.kills >= 40) unlockChar('raphidash','Raphidash');
  if (progress.level >= 10) unlockChar('zapi','Zapi');
  if (emeraldCount() >= 4) unlockChar('naia','Naia');
}
function checkAchievements(){
  if (checkingAch) return;
  checkingAch = true;
  checkUnlocks();
  let again = true;
  while (again){
    again = false;
    for (const a of ACHIEVEMENTS){
      if (!progress.achievements[a.id] && a.test(progress)){
        progress.achievements[a.id] = true;
        progress.crystals += a.reward; progress.earned += a.reward;
        showBanner(`🏆 Conquista: ${a.name}  (+${a.reward} 💎)`); sfxPickup();
        checkUnlocks(); again = true;
      }
    }
  }
  checkingAch = false;
}
function grantCrystals(n){ progress.crystals += n; progress.earned += n; checkAchievements(); }
function refreshFollowers(){

/* ---------------- maps: corner mini-map + full map (M key / 🗺 button) ---------------- */
// Chapters have no fixed grid, so the map is built as you walk: each room you leave through a side exit is placed on the
// matching side of the room you left, and doors inside a room go to the nearest free cell. Unexplored exits show as "?".
const mapNodes = new Map();
let mapCur = null, mapExitDir = null, mapOpen = false;
const MAP_VEC = { l:[-1,0], r:[1,0], u:[0,-1], d:[0,1] }, MAP_OPP = { l:'r', r:'l', u:'d', d:'u' };
const MAP_SMALL = ['de','do','da','dos','das','o','a','e','para','no','na','em'];
function mapReset(){ mapNodes.clear(); mapCur = null; mapExitDir = null; }
function exitDir(ex){
  const cx = ex.x+ex.w/2, cy = ex.y+ex.h/2, d = { l:cx, r:W-cx, u:cy-60, d:H-cy };   // walkable area starts around y=70
  let best = null; for (const k in d) if (best === null || d[k] < d[best]) best = k;
  return d[best] <= 110 ? best : null;                                              // farther than that = a door inside the room
}
function mapNodeName(scene){
  const raw = (scene.banner || 'Sala').toLowerCase().replace(/^cap[ií]tulo \d+ — /, '');
  return raw.split(' ').map((w,i)=> (i > 0 && MAP_SMALL.includes(w)) ? w : w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
}
function mapFreeCell(gx, gy){
  const taken = new Set([...mapNodes.values()].map(n=> n.gx+','+n.gy));
  if (!taken.has(gx+','+gy)) return [gx,gy];
  for (let r=1; r<8; r++) for (let dy=-r; dy<=r; dy++) for (let dx=-r; dx<=r; dx++){
    if (Math.max(Math.abs(dx),Math.abs(dy)) !== r) continue;
    if (!taken.has((gx+dx)+','+(gy+dy))) return [gx+dx, gy+dy];
  }
  return [gx,gy];
}
function mapEnter(scene){
  if (scene.isOpenWorld){ mapReset(); return; }          // the open world has its own fixed grid
  const dir = mapExitDir; mapExitDir = null;
  let node = mapNodes.get(scene);
  if (!node){
    let gx = 0, gy = 0;
    if (mapCur){ const v = MAP_VEC[dir] || MAP_VEC.r; gx = mapCur.gx+v[0]; gy = mapCur.gy+v[1]; }
    [gx,gy] = mapFreeCell(gx,gy);
    node = { gx, gy, name:mapNodeName(scene), links:{} };
    mapNodes.set(scene, node);
  }
  if (mapCur && mapCur !== node && dir){ mapCur.links[dir] = node; node.links[MAP_OPP[dir]] = mapCur; }
  mapCur = node;
}
function mapStubs(){       // sides of the current room that have an exit you haven't walked through yet
  const out = [];
  if (!mapCur || !currentScene) return out;
  (currentScene.exits||[]).forEach(ex=>{ const d = exitDir(ex); if (d && !mapCur.links[d] && !out.includes(d)) out.push(d); });
  return out;
}
function mapLabel(g, text, x, y, size, align){
  g.font = `bold ${size}px sans-serif`; g.textAlign = align;
  g.lineWidth = 3; g.strokeStyle = 'rgba(0,0,0,0.85)'; g.strokeText(text, x, y);
  g.fillStyle = '#ffffff'; g.fillText(text, x, y);
}
function drawChapterMiniMap(g){
  if (!mapCur) return;
  const cols = 7, rows = 5, cw = 20, ch = 15, pw = cols*cw, ph = rows*ch, ox = W-14-pw, oy = 64, t = Date.now()/1000;
  g.save();
  g.fillStyle = 'rgba(8,10,24,0.72)'; g.fillRect(ox-4,oy-4,pw+8,ph+8);
  const cx0 = mapCur.gx-3, cy0 = mapCur.gy-2;
  mapNodes.forEach(n=>{
    const c = n.gx-cx0, r = n.gy-cy0;
    if (c < 0 || c >= cols || r < 0 || r >= rows) return;
    const x = ox+c*cw, y = oy+r*ch;
    g.fillStyle = '#5a78b8'; if (n.links.r) g.fillRect(x+cw-4,y+ch/2-1,6,2); if (n.links.d) g.fillRect(x+cw/2-1,y+ch-3,2,5);
    g.fillStyle = n === mapCur ? '#ffd54a' : '#3a5a98'; g.fillRect(x+2,y+2,cw-6,ch-5);
  });
  const cx = ox+3*cw, cy = oy+2*ch, pulse = 0.5+0.5*Math.sin(t*4);
  g.strokeStyle = `rgba(255,255,255,${0.5+0.5*pulse})`; g.lineWidth = 1.5; g.strokeRect(cx+1,cy+1,cw-4,ch-3);
  mapStubs().forEach(d=>{
    const px = d==='l' ? cx-1 : d==='r' ? cx+cw-2 : cx+cw/2-2, py = d==='u' ? cy : d==='d' ? cy+ch-2 : cy+ch/2-1;
    g.fillStyle = `rgba(255,150,80,${0.55+0.45*pulse})`; g.beginPath(); g.arc(px,py,2.6,0,Math.PI*2); g.fill();
  });
  mapLabel(g, mapCur.name, ox+pw, oy+ph+16, 11, 'right');
  g.font = '9px sans-serif'; g.textAlign = 'right'; g.fillStyle = 'rgba(255,255,255,0.55)'; g.fillText('M ou 🗺 = mapa', ox+pw, oy+ph+28);
  g.restore();
}
function wrapMapText(g, text, maxW){
  const words = text.split(' '), lines = []; let cur = '';
  words.forEach(w=>{ const test = cur ? cur+' '+w : w; if (g.measureText(test).width > maxW && cur){ lines.push(cur); cur = w; } else cur = test; });
  if (cur) lines.push(cur);
  return lines.slice(0,3);
}
