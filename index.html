<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuga Alienígena</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#0a0e1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duo">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --ui-scale:1; --safe:0px; }
  html,body {
    width:100%; height:100%; background:#0a0e1a; overflow:hidden;
    font-family:'Trebuchet MS','Segoe UI',sans-serif; color:#eef;
  }
  #wrap {
    position:relative; width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
  }
  #stage {
    position:relative; width:min(960px, 100vw, calc(100vh * 8 / 5)); aspect-ratio:8/5; max-height:100vh;
    background:#000; border:3px solid #2a3a63; border-radius:6px; overflow:hidden;
    box-shadow:0 0 50px rgba(80,140,255,0.25);
    transform:scale(var(--ui-scale)); transition:transform 0.15s ease;
  }
  body.lowfx * { box-shadow:none !important; text-shadow:none !important; }
  canvas { display:block; background:#123; image-rendering:pixelated; width:100%; height:100%; }

  #hint {
    position:absolute; left:50%; bottom:calc(96px + var(--safe)); transform:translateX(-50%);
    background:rgba(10,14,26,0.75); border:1px solid #4a5a8a; border-radius:6px;
    padding:6px 14px; font-size:13px; color:#ffd54a; letter-spacing:1px;
    pointer-events:none; display:none; white-space:nowrap;
  }
  #chapterBanner {
    position:absolute; top:calc(26px + var(--safe)); left:50%; transform:translateX(-50%);
    font-size:28px; letter-spacing:3px; color:#7ef9ff;
    text-shadow:0 0 16px rgba(126,249,255,0.8);
    opacity:0; transition:opacity 0.6s; pointer-events:none; text-align:center;
  }
  #flash {
    position:absolute; inset:0; background:#ff2244; opacity:0; pointer-events:none;
    transition:opacity 0.08s;
  }

  #inventoryHud {
    position:absolute; top:calc(14px + var(--safe)); left:calc(14px + var(--safe)); z-index:15;
    display:flex; gap:8px; pointer-events:none;
  }
  .invSlot {
    width:38px; height:38px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-size:19px; background:rgba(10,14,26,0.7); border:1px solid #3a4a70;
    filter:grayscale(1) brightness(0.35); opacity:0.55; transition:filter 0.3s, opacity 0.3s, box-shadow 0.3s;
  }
  .invSlot.owned {
    filter:none; opacity:1; box-shadow:0 0 12px rgba(255,213,74,0.55); border-color:#ffd54a;
  }

  /* dialogue box */
  #dialogueBox {
    position:absolute; left:calc(24px + var(--safe)); right:calc(24px + var(--safe)); bottom:calc(20px + var(--safe)); min-height:110px;
    background:rgba(8,10,20,0.92); border:2px solid #4a5a8a; border-radius:10px;
    padding:14px 20px; display:none; flex-direction:column; gap:6px;
    box-shadow:0 0 30px rgba(0,0,0,0.6);
  }
  #dialogueSpeaker { font-weight:bold; font-size:15px; letter-spacing:1px; }
  #dialogueText { font-size:15px; line-height:1.5; color:#dfe8ff; min-height:44px; }
  #dialogueAdvance { align-self:flex-end; font-size:12px; color:#8fa; opacity:0.85; }

  #actionBtn {
    position:absolute; right:calc(22px + var(--safe)); bottom:calc(140px + var(--safe)); z-index:20;
    width:78px; height:78px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(180deg,#ffd54a,#b8860b); color:#2a1a00;
    font-family:inherit; font-weight:bold; font-size:13px; letter-spacing:0.5px;
    box-shadow:0 0 20px rgba(255,213,74,0.55);
    display:none; align-items:center; justify-content:center; text-align:center; line-height:1.2;
  }
  #actionBtn:active { filter:brightness(0.9); transform:scale(0.96); }

  #battleAttackBtn {
    position:absolute; right:calc(22px + var(--safe)); bottom:calc(70px + var(--safe)); z-index:20; pointer-events:auto;
    width:86px; height:86px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(180deg,#c9a0ff,#7a3fd0); color:#1a0a2e;
    font-family:inherit; font-weight:bold; font-size:26px;
    box-shadow:0 0 22px rgba(154,95,224,0.6);
    display:none; align-items:center; justify-content:center;
  }
  #battleAttackBtn:active { filter:brightness(0.9); transform:scale(0.96); }
  #battleAttackBtn:disabled { filter:grayscale(0.6) brightness(0.7); cursor:default; }

  /* on-screen movement D-pad — touch devices only (phones/tablets have no arrow keys) */
  #dpad {
    position:absolute; left:calc(10px + var(--safe)); bottom:calc(10px + var(--safe)); z-index:20;
    display:none; grid-template-columns:repeat(3, clamp(34px, 8vmin, 56px)); grid-template-rows:repeat(3, clamp(34px, 8vmin, 56px)); gap:clamp(2px, 0.8vmin, 4px);
  }
  @media (pointer:coarse){ #dpad.enabled { display:grid; } }
  .dpadBtn {
    border:none; border-radius:20%; background:rgba(20,26,46,0.6); color:#cfe0ff; font-size:clamp(14px, 3.5vmin, 22px);
    display:flex; align-items:center; justify-content:center; user-select:none; -webkit-user-select:none;
    touch-action:none; border:1px solid rgba(126,249,255,0.3);
  }
  .dpadBtn:active { background:rgba(126,249,255,0.35); }
  #dpadUp{grid-column:2;grid-row:1;}
  #dpadLeft{grid-column:1;grid-row:2;}
  #dpadRight{grid-column:3;grid-row:2;}
  #dpadDown{grid-column:2;grid-row:3;}

  /* overlays: menu / chapter end */
  .fullOverlay {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; text-align:center;
    background:radial-gradient(ellipse at center, #10182e 0%, #05070f 100%);
  }
  .fullOverlay h1 { font-size:38px; color:#7ef9ff; text-shadow:0 0 20px #00c8ff; letter-spacing:3px; }
  .fullOverlay h2 { font-size:24px; color:#ffd54a; text-shadow:0 0 14px rgba(255,213,74,0.6); }
  .fullOverlay p { max-width:520px; font-size:14px; line-height:1.7; color:#9fb; }
  .btnRow { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .gameBtn {
    padding:12px 26px; font-size:15px; font-family:inherit; letter-spacing:1px;
    border:none; border-radius:8px; cursor:pointer; font-weight:bold;
    background:linear-gradient(180deg,#1fd0ff,#0088cc); color:#001622;
    box-shadow:0 0 18px rgba(0,200,255,0.5);
  }
  .gameBtn.secondary { background:linear-gradient(180deg,#5cff9a,#1e9955); color:#002a12; }
  .gameBtn.locked { background:#2a3550; color:#6a7a95; cursor:not-allowed; box-shadow:none; }
  .gameBtn:hover:not(.locked) { filter:brightness(1.15); }
  .hidden { display:none !important; }

  /* battle — slim real-time HUD; the arena itself renders on the game canvas underneath */
  #battleOverlay {
    position:absolute; inset:0; display:none; flex-direction:column; justify-content:space-between;
    padding:calc(14px + var(--safe)) calc(18px + var(--safe)); pointer-events:none; z-index:12;
  }
  #battleTitle { text-align:center; font-size:15px; letter-spacing:2px; color:#c9a8ff; text-shadow:0 0 10px rgba(201,168,255,0.6); }
  #battleHudTop { display:flex; justify-content:space-between; gap:16px; margin-top:6px; }
  .battleHpCard { width:260px; background:rgba(10,6,18,0.72); border:1px solid #3a2a4a; border-radius:8px; padding:8px 12px; }
  .battleHpCard.enemy { align-self:flex-end; }
  .hpLabel { font-size:13px; color:#dfe8ff; margin-bottom:5px; display:flex; justify-content:space-between; }
  .hpBarBg { width:100%; height:11px; background:#241a30; border:1px solid #55406a; border-radius:6px; overflow:hidden; }
  .hpBarFill { height:100%; background:linear-gradient(90deg,#5cff9a,#1e9955); transition:width 0.35s ease; }
  .hpBarFill.enemy { background:linear-gradient(90deg,#ff6a6a,#a01e1e); }
  #battleToast {
    align-self:center; background:rgba(10,6,18,0.8); border:1px solid #3a2a4a; border-radius:8px;
    padding:8px 16px; font-size:13.5px; color:#e8d8ff; opacity:0; transition:opacity 0.3s; text-align:center; max-width:70%;
  }
  #battleHint { align-self:center; font-size:12px; color:#c9a8ff; opacity:0.8; margin-bottom:4px; }
  #battleActions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; pointer-events:auto; }
  .battleBtn {
    padding:10px 18px; font-family:inherit; font-size:14px; font-weight:bold; letter-spacing:0.5px;
    border:none; border-radius:8px; cursor:pointer; color:#fff;
    background:linear-gradient(180deg,#7a4ad0,#4a2a90); box-shadow:0 0 12px rgba(120,80,220,0.5);
  }
  .battleBtn:hover { filter:brightness(1.2); }
  .battleBtn:disabled { background:#2a2540; color:#6a6a80; cursor:not-allowed; box-shadow:none; }

  /* pause / settings */
  #settingsBtn {
    position:absolute; top:calc(14px + var(--safe)); right:calc(14px + var(--safe)); z-index:30; pointer-events:auto;
    width:38px; height:38px; border-radius:8px; border:1px solid #3a4a70; cursor:pointer;
    background:rgba(10,14,26,0.75); color:#cfe0ff; font-size:19px;
    display:flex; align-items:center; justify-content:center;
  }
  #settingsBtn:hover { background:rgba(30,40,70,0.92); }
  #settingsOverlay {
    position:absolute; inset:0; z-index:40; display:none; align-items:center; justify-content:center;
    background:rgba(4,6,14,0.82);
  }
  #settingsOverlay.open { display:flex; }
  #settingsPanel {
    width:min(560px, 92%); max-height:86%; overflow-y:auto;
    background:linear-gradient(180deg,#141a30,#0c0f1e); border:1px solid #3a4a70; border-radius:12px;
    padding:22px 26px; display:flex; flex-direction:column; gap:16px;
    box-shadow:0 0 40px rgba(0,0,0,0.6);
  }
  #settingsPanel h2 { font-size:20px; color:#7ef9ff; letter-spacing:1px; text-align:center; }
  .settingsRow { display:flex; flex-direction:column; gap:7px; }
  .settingsRow label { font-size:11.5px; letter-spacing:1px; color:#9fb3d8; text-transform:uppercase; display:flex; justify-content:space-between; }
  .segGroup { display:flex; gap:8px; flex-wrap:wrap; }
  .segBtn {
    flex:1; min-width:80px; padding:8px 10px; font-family:inherit; font-size:13px; font-weight:bold;
    border:1px solid #3a4a70; border-radius:7px; background:#1a2340; color:#cfe0ff; cursor:pointer;
  }
  .segBtn.active { background:linear-gradient(180deg,#1fd0ff,#0088cc); color:#001622; border-color:#1fd0ff; }
  .segBtn:hover:not(.active) { filter:brightness(1.2); }
  .settingsRow select {
    padding:8px 10px; font-family:inherit; font-size:13px; background:#1a2340; color:#cfe0ff;
    border:1px solid #3a4a70; border-radius:7px;
  }
  .settingsRow input[type=range] { width:100%; }
  .settingsVal { color:#7ef9ff; font-size:11px; letter-spacing:0; text-transform:none; }
  .settingsActions { display:flex; gap:12px; justify-content:center; margin-top:2px; flex-wrap:wrap; }
  .settingsHr { border:none; border-top:1px solid #2a3a63; margin:2px 0; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="960" height="600"></canvas>
    <div id="flash"></div>
    <div id="chapterBanner"></div>
    <div id="hint"></div>
    <div id="inventoryHud">
      <div class="invSlot" id="invJewel" title="Joia da Vida">💚</div>
      <div class="invSlot" id="invEmerald" title="Esmeralda do Poder">💎</div>
      <div class="invSlot" id="invWeapon" title="Arma Alienígena">🔫</div>
      <div class="invSlot" id="invTeleport" title="Joia do Teleporte">🌀</div>
      <div class="invSlot" id="invElemental" title="Esmeralda dos Elementos">🟠</div>
      <div class="invSlot" id="invDisguise" title="Esmeralda do Disfarce">🎭</div>
    </div>
    <button id="actionBtn" type="button">Interagir</button>
    <button id="battleAttackBtn" type="button" title="Atacar">⚔</button>
    <button id="settingsBtn" type="button" title="Menu / Configurações">⚙</button>

    <div id="dpad">
      <button class="dpadBtn" id="dpadUp" type="button">▲</button>
      <button class="dpadBtn" id="dpadLeft" type="button">◀</button>
      <button class="dpadBtn" id="dpadRight" type="button">▶</button>
      <button class="dpadBtn" id="dpadDown" type="button">▼</button>
    </div>

    <div id="settingsOverlay">
      <div id="settingsPanel">
        <h2>Menu</h2>
        <div class="settingsActions">
          <button class="gameBtn" id="btnResume">▶ Continuar</button>
          <button class="gameBtn secondary" id="btnGoWorld">🌎 Selecionar capítulo</button>
        </div>

        <hr class="settingsHr">

        <div class="settingsRow">
          <label>Dificuldade</label>
          <div class="segGroup" id="segDifficulty">
            <button class="segBtn" data-val="facil">Fácil</button>
            <button class="segBtn" data-val="normal">Normal</button>
            <button class="segBtn" data-val="dificil">Difícil</button>
          </div>
        </div>

        <div class="settingsRow">
          <label>Qualidade gráfica</label>
          <div class="segGroup" id="segQuality">
            <button class="segBtn" data-val="alta">Alta</button>
            <button class="segBtn" data-val="media">Média</button>
            <button class="segBtn" data-val="baixa">Baixa</button>
          </div>
        </div>

        <div class="settingsRow">
          <label>Idioma</label>
          <select id="selLanguage">
            <option value="pt">Português (BR)</option>
            <option value="en" disabled>English — em breve</option>
            <option value="es" disabled>Español — em breve</option>
          </select>
        </div>

        <div class="settingsRow">
          <label>Tamanho da tela (zoom) <span class="settingsVal" id="valScale">100%</span></label>
          <input type="range" id="rangeScale" min="80" max="120" step="2" value="100">
        </div>

        <div class="settingsRow">
          <label>Área segura (margem pra borda cortada / TV) <span class="settingsVal" id="valSafe">0px</span></label>
          <input type="range" id="rangeSafe" min="0" max="40" step="2" value="0">
        </div>

        <hr class="settingsHr">

        <div class="settingsActions">
          <button class="gameBtn" style="background:linear-gradient(180deg,#ff6a6a,#a01e1e);" id="btnRestart">↺ Reiniciar tudo</button>
          <button class="gameBtn" id="btnCloseSettings">Fechar</button>
        </div>
      </div>
    </div>

    <div id="dialogueBox">
      <div id="dialogueSpeaker"></div>
      <div id="dialogueText"></div>
      <div id="dialogueAdvance">▶ espaço / clique para continuar</div>
    </div>

    <div id="battleOverlay">
      <div>
        <div id="battleTitle"></div>
        <div id="battleHudTop">
          <div class="battleHpCard" id="battlePlayerCard">
            <div class="hpLabel"><span id="battlePlayerName"></span><span id="battlePlayerHpText"></span></div>
            <div class="hpBarBg"><div class="hpBarFill" id="battlePlayerHpBar"></div></div>
          </div>
          <div class="battleHpCard enemy" id="battleEnemyCard">
            <div class="hpLabel"><span id="battleEnemyName"></span><span id="battleEnemyHpText"></span></div>
            <div class="hpBarBg"><div class="hpBarFill enemy" id="battleEnemyHpBar"></div></div>
          </div>
        </div>
      </div>
      <div id="battleToast"></div>
      <div>
        <div id="battleHint">setas/WASD pra andar · espaço pra atacar de perto</div>
        <div id="battleActions"></div>
      </div>
    </div>

    <div id="menuOverlay" class="fullOverlay">
      <h1>FUGA ALIENÍGENA</h1>
      <p>Uma história em capítulos. Comece pelo Capítulo 1 — o resto libera conforme você avança.</p>
      <div class="btnRow">
        <button class="gameBtn" id="btnCh1">Capítulo 1: O Bosque Mágico</button>
        <button class="gameBtn secondary" id="btnCh2">Capítulo 2: Vulcrom</button>
        <button class="gameBtn" id="btnCh3" style="background:linear-gradient(180deg,#c98fff,#7a3fd0);">Capítulo 3: O Encontro</button>
        <button class="gameBtn" id="btnCh4" style="background:linear-gradient(180deg,#ff9a5c,#b8480f);">Capítulo 4: O Titã</button>
      </div>
      <p style="font-size:12px;opacity:0.6;">Mover: setas / WASD &nbsp;·&nbsp; Interagir: espaço/enter</p>
    </div>

    <div id="endOverlay" class="fullOverlay hidden">
      <h2 id="endTitle"></h2>
      <p id="endText"></p>
      <div class="btnRow" id="endButtons"></div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let unlocked = { ch2: false, ch3: false, ch4: false };
let upgrades = { jewelOfLife: false, emeraldOfPower: false, alienWeapon: false, teleportGem: false, elementalEmerald: false, disguiseEmerald: false };

/* ---------------- settings (session-only, no storage) ---------------- */
let settings = { difficulty:'normal', quality:'alta', language:'pt', scale:100, safe:0 };
const DIFFICULTY_MULT = {
  facil:   { hp:0.75, atk:0.7 },
  normal:  { hp:1,    atk:1 },
  dificil: { hp:1.3,  atk:1.4 },
};

/* ---------------- sound (synthesized, no audio files needed) ---------------- */
let audioCtx = null;
function getAudioCtx(){
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function beep(freq, duration, type, volume, delay){
  try{
    const ctx = getAudioCtx();
    const startAt = ctx.currentTime + (delay||0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, startAt);
    gain.gain.setValueAtTime(volume||0.15, startAt);
    gain.gain.exponentialRampToValueAtTime(0.001, startAt + duration);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(startAt); osc.stop(startAt + duration + 0.02);
  } catch(e){ /* audio not available — fail silently */ }
}
function sfxAttack(){ beep(320,0.09,'square',0.16); beep(180,0.1,'square',0.12,0.05); }
function sfxAllyAssist(){ beep(500,0.08,'triangle',0.16); beep(700,0.1,'triangle',0.14,0.06); }
function sfxEnemyHit(){ beep(140,0.14,'sawtooth',0.14); }
function sfxVictory(){ [523,659,784,1047].forEach((f,i)=> beep(f,0.18,'triangle',0.14,i*0.11)); }
function sfxDefeat(){ [300,240,180].forEach((f,i)=> beep(f,0.22,'sawtooth',0.13,i*0.14)); }
function sfxStep(){ beep(95,0.045,'square',0.045); }
function sfxPickup(){ beep(660,0.08,'triangle',0.14); beep(880,0.12,'triangle',0.13,0.07); }

/* ---------------- input ---------------- */
const keys = {};
window.addEventListener('keydown', e=>{
  if (e.key === 'Escape'){ toggleSettings(); return; }
  if (settingsOpen) return;
  keys[e.key.toLowerCase()] = true;
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
  if (e.key===' ' || e.key==='Enter') handleInteractKey();
});
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });
document.getElementById('dialogueBox').addEventListener('click', ()=> advanceDialogue());

/* ---------------- character drawing ---------------- */
// all sprites are procedurally drawn (no image assets needed)
function roundRect(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);
  g.arcTo(x,y,x+w,y,r);
  g.closePath();
}
// full-body owl: feet, tapered body, head tufts, belly, wing, beak — palette-driven so parents can reuse it
function drawOwlAdult(g,x,y,s,facing,opts){
  opts = opts || {};
  const bodyColor = opts.body || '#4fb800';
  const bellyColor = opts.belly || '#eaffe0';
  const wingColor = opts.wing || '#3a8f00';
  const beakColor = opts.beak || '#ffb020';
  facing = facing || 1;
  g.save(); g.translate(x,y);
  // feet
  g.fillStyle = beakColor;
  g.beginPath(); g.ellipse(-s*0.22, s*0.8, s*0.14, s*0.09, 0,0,Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(s*0.22, s*0.8, s*0.14, s*0.09, 0,0,Math.PI*2); g.fill();
  // body (tapered egg shape, wider base than head)
  g.fillStyle = bodyColor;
  g.beginPath();
  g.moveTo(-s*0.6, s*0.05);
  g.bezierCurveTo(-s*0.6,-s*0.58,-s*0.3,-s*0.86,0,-s*0.86);
  g.bezierCurveTo(s*0.3,-s*0.86,s*0.6,-s*0.58,s*0.6,s*0.05);
  g.bezierCurveTo(s*0.6,s*0.5,s*0.32,s*0.74,0,s*0.74);
  g.bezierCurveTo(-s*0.32,s*0.74,-s*0.6,s*0.5,-s*0.6,s*0.05);
  g.closePath(); g.fill();
  // head feather tufts
  g.beginPath(); g.moveTo(-s*0.2,-s*0.8); g.lineTo(-s*0.3,-s*1.02); g.lineTo(-s*0.06,-s*0.86); g.closePath(); g.fill();

/* ---------------- dialogue system ---------------- */
let dialogueQueue = [], dialogueIdx = 0, dialogueActive = false, dialogueOnEnd = null;
const dialogueBox = document.getElementById('dialogueBox');
const dialogueSpeaker = document.getElementById('dialogueSpeaker');
const dialogueText = document.getElementById('dialogueText');

function startDialogue(lines, onEnd){
  dialogueQueue = lines; dialogueIdx = 0; dialogueActive = true; dialogueOnEnd = onEnd || null;
  dialogueBox.style.display = 'flex';
  showDialogueLine();
}
function showDialogueLine(){
  const line = dialogueQueue[dialogueIdx];
  dialogueSpeaker.textContent = line.speaker;
  dialogueSpeaker.style.color = line.color || '#7ef9ff';
  dialogueText.textContent = line.text;
}
function advanceDialogue(){
  if (!dialogueActive) return;
  dialogueIdx++;
  if (dialogueIdx >= dialogueQueue.length){
    dialogueActive = false;
    dialogueBox.style.display = 'none';
    const cb = dialogueOnEnd; dialogueOnEnd = null;
    if (cb) cb();
  } else {
    showDialogueLine();
  }
}

// on-screen D-pad — mirrors the same `keys` flags the keyboard uses, so movement code needs no changes
const dpad = document.getElementById('dpad');
dpad.classList.add('enabled');
function bindDpad(id, key){
  const el = document.getElementById(id);
  const press = (e)=>{ e.preventDefault(); keys[key] = true; };
  const release = (e)=>{ e.preventDefault(); keys[key] = false; };
  el.addEventListener('pointerdown', press);
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
  el.addEventListener('pointerleave', release);
}
bindDpad('dpadUp', 'arrowup');
bindDpad('dpadLeft', 'arrowleft');

bindDpad('dpadDown', 'arrowdown');

function showBanner(text){
  chapterBanner.textContent = text;
  chapterBanner.style.opacity = '1';
  setTimeout(()=>{ chapterBanner.style.opacity = '0'; }, 2200);
}
function flash(color){
  if (settings.quality === 'baixa') return;
  const f = document.getElementById('flash');
  f.style.background = color || '#ff2244';
  f.style.opacity = '0.55';
  setTimeout(()=>{ f.style.opacity = '0'; }, 90);
  if (settings.quality !== 'media'){
    setTimeout(()=>{ f.style.opacity = '0.4'; }, 220);
    setTimeout(()=>{ f.style.opacity = '0'; }, 320);
  }
}

function rectsOverlap(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}
function expand(r,pad){ return {x:r.x-pad,y:r.y-pad,w:r.w+pad*2,h:r.h+pad*2}; }

function goToScene(scene, spawn){
  currentScene = scene;
  player.x = spawn.x; player.y = spawn.y;
  sceneLocked = false;
  if (scene.onEnter) scene.onEnter();
  if (scene.banner) showBanner(scene.banner);
}

function updateActionButton(){
  const menuVisible = !menuOverlay.classList.contains('hidden');
  const endVisible = !endOverlay.classList.contains('hidden');
  const battleVisible = battleOverlay.style.display === 'flex';
  dpad.style.display = (menuVisible || endVisible || dialogueActive) ? 'none' : '';
  if (menuVisible || endVisible || battleVisible){
    actionBtn.style.display = 'none';
    return;
  }
  if (dialogueActive){
    actionBtn.style.display = 'flex';
    actionBtn.textContent = 'Continuar';
    return;
  }
  if (sceneLocked || !currentScene){
    actionBtn.style.display = 'none';
    return;
  }
  const pRect = {x:player.x, y:player.y, w:player.w, h:player.h};
  const near = (currentScene.npcs||[]).some(npc => rectsOverlap(expand(pRect,14), npc));
  actionBtn.style.display = near ? 'flex' : 'none';
  actionBtn.textContent = 'Interagir';
}

function handleInteractKey(){
  if (battle){ battleAttack(); return; }
  if (dialogueActive){ advanceDialogue(); return; }
  if (sceneLocked || !currentScene) return;
  const pRect = {x:player.x, y:player.y, w:player.w, h:player.h};
  for (const npc of (currentScene.npcs||[])){
    if (rectsOverlap(expand(pRect,14), npc)){
      npc.onInteract && npc.onInteract();
      return;
    }
  }
}

let stepTimer = 0;
function updateExploration(dt){
  if (dialogueActive || sceneLocked || !currentScene) return;
  let dx=0, dy=0;
  if (keys['arrowleft']||keys['a']) dx -= 1;
  if (keys['arrowright']||keys['d']) dx += 1;
  if (keys['arrowup']||keys['w']) dy -= 1;
  if (keys['arrowdown']||keys['s']) dy += 1;
  if (dx||dy){
    const len = Math.hypot(dx,dy); dx/=len; dy/=len;
    player.facing = dx < 0 ? -1 : (dx>0 ? 1 : (player.facing||1));
    const nx = player.x + dx*player.speed*dt;
    const ny = player.y + dy*player.speed*dt;
    const tryRect = {x:nx, y:player.y, w:player.w, h:player.h};
    let moved = false;
    if (!(currentScene.obstacles||[]).some(o=>rectsOverlap(tryRect,o))){ player.x = clampX(nx); moved = true; }
    const tryRect2 = {x:player.x, y:ny, w:player.w, h:player.h};
    if (!(currentScene.obstacles||[]).some(o=>rectsOverlap(tryRect2,o))){ player.y = clampY(ny); moved = true; }
    if (moved){
      stepTimer -= dt;
      if (stepTimer <= 0){ sfxStep(); stepTimer = 0.28; }
    }
  } else {
    stepTimer = 0;
  }
  if (followers.length){
    followerTrail.unshift({x:player.x, y:player.y});
    const maxLen = (followers.length+1)*FOLLOWER_SPACING + 4;
    if (followerTrail.length > maxLen) followerTrail.length = maxLen;
  }
  if (battle) return; // fighting on top of this room — exits/interact stay off until the battle ends
  // exits
  const pRect = {x:player.x, y:player.y, w:player.w, h:player.h};
  for (const ex of (currentScene.exits||[])){
    if (rectsOverlap(pRect, ex)){ ex.onEnter(); return; }
  }
  // interact hint
  let showHint = false;
  for (const npc of (currentScene.npcs||[])){
    if (rectsOverlap(expand(pRect,14), npc)){ showHint = true; break; }
  }
  hintEl.style.display = showHint ? 'block' : 'none';
  hintEl.textContent = '␣ interagir';
}
function clampX(v){ return Math.max(20, Math.min(W-20-player.w, v)); }
function clampY(v){ return Math.max(70, Math.min(H-20-player.h, v)); }

function renderScene(){
  ctx.clearRect(0,0,W,H);
  if (!currentScene) return;
  currentScene.draw(ctx);
  for (const npc of (currentScene.npcs||[])){
    const draw = DRAW[npc.type];
    if (draw) draw(ctx, npc.x+npc.w/2, npc.y+npc.h/2, npc.scale||34, npc.talking);
    if (npc.label){
      ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.font='11px sans-serif'; ctx.textAlign='center';
      ctx.fillText(npc.label, npc.x+npc.w/2, npc.y - 8);
    }
  }
  if (!battle){
    followers.forEach((type,i)=>{
      const sample = followerTrail[Math.min(followerTrail.length-1, (i+1)*FOLLOWER_SPACING)];
      if (!sample) return;
      const draw = DRAW[type];
      if (draw) draw(ctx, sample.x+player.w/2, sample.y+player.h/2, PLAYER_SCALE[type]||34, false);
    });
  }
  DRAW[player.type](ctx, player.x+player.w/2, player.y+player.h/2, PLAYER_SCALE[player.type]||34, false);
  if (battle){
    DRAW[battle.enemy.type](ctx, battle.enemyPos.x, battle.enemyPos.y, battle.enemy.scale||52);
    battle.projectiles.forEach(pr=>{
      ctx.fillStyle = pr.color; ctx.beginPath(); ctx.arc(pr.x,pr.y,pr.r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.arc(pr.x,pr.y,pr.r*0.5,0,Math.PI*2); ctx.fill();
    });
  }
}

/* ---------------- battle system (real-time arena) ---------------- */
const battleOverlay = document.getElementById('battleOverlay');
const battleTitle = document.getElementById('battleTitle');
const battleToastEl = document.getElementById('battleToast');
const battleActions = document.getElementById('battleActions');

let battle = null;
let toastTimer = null;

function toast(msg){
  battleToastEl.textContent = msg;
  battleToastEl.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ battleToastEl.style.opacity = '0'; }, 2200);
}
function refreshHpUI(){
  const p = battle.player, e = battle.enemy;
  document.getElementById('battlePlayerName').textContent = p.name;
  document.getElementById('battlePlayerHpText').textContent = `${Math.max(0,p.hp)}/${p.maxHp}`;
  document.getElementById('battlePlayerHpBar').style.width = Math.max(0,p.hp/p.maxHp*100)+'%';
  document.getElementById('battleEnemyName').textContent = e.name;
  document.getElementById('battleEnemyHpText').textContent = `${Math.max(0,e.hp)}/${e.maxHp}`;
  document.getElementById('battleEnemyHpBar').style.width = Math.max(0,e.hp/e.maxHp*100)+'%';
}
function rnd(a,b){ return Math.round(a + Math.random()*(b-a)); }

// config: title, intro, player, enemy, secondary?, allyAssist?, fleeChance?, ranged?,
//         guaranteedDefeatAfterTurns? (now: force defeat after taking this many hits), scriptedDefeatMsg?,
//         onVictory, onDefeat, onFlee?
// The fight plays out on top of whatever room is already on screen — no separate arena backdrop.
function startBattle(config){
  battle = config;
  const dm = DIFFICULTY_MULT[settings.difficulty] || DIFFICULTY_MULT.normal;
  battle.enemy.hp = Math.round(battle.enemy.hp * dm.hp);
  battle.enemy.maxHp = Math.round(battle.enemy.maxHp * dm.hp);
  battle.enemy.atk = Math.round(battle.enemy.atk * dm.atk);
  battle.hitsTaken = 0;
  battle.secondaryUsed = false;
  battle.projectiles = [];
  battle.playerAtkCd = 0;
  battle.allyCd = 0;
  battle.fleeCd = 0;
  battle.enemyAtkCd = 0.9;

  player.type = battle.player.type;
  const px = player.x+player.w/2, py = player.y+player.h/2;
  const ex = Math.max(80, Math.min(W-80, px + (px < W/2 ? 220 : -220)));
  const ey = Math.max(100, Math.min(H-80, py));
  battle.enemyPos = { x: ex, y: ey };
  sceneLocked = false;

  battleTitle.textContent = config.title;
  toast(config.intro);
  refreshHpUI();
  battleActions.innerHTML = '';
  const mkBtn = (label, fn) => {
    const b = document.createElement('button');
    b.className = 'battleBtn'; b.textContent = label;
    b.onclick = fn; battleActions.appendChild(b); return b;
  };
  mkBtn(config.playerRanged ? '🚀 Atirar' : '⚔ Atacar', battleAttack);
  if (config.allyAssist) mkBtn('🤝 Huggy ajuda!', battleAllyAssist);
  mkBtn('🏃 Fugir', battleFlee);
  document.getElementById('battleHint').textContent = config.playerRanged
    ? 'setas/WASD pra andar · espaço pra atirar (mira automática)'
    : 'setas/WASD pra andar · espaço pra atacar de perto';

  battleOverlay.style.display = 'flex';
  battleAttackBtn.style.display = 'flex';
  battleAttackBtn.textContent = config.playerRanged ? '🚀' : '⚔';
}

function endBattleArena(outcome){
  battleOverlay.style.display = 'none';
  battleAttackBtn.style.display = 'none';
  const cfg = battle; battle = null;
  sceneLocked = false;
  if (outcome === 'victory'){ sfxVictory(); if (cfg.onVictory) cfg.onVictory(); }
  else if (outcome === 'fled') (cfg.onFlee || cfg.onDefeat) && (cfg.onFlee || cfg.onDefeat)();
  else if (outcome === 'defeat'){ sfxDefeat(); if (cfg.onDefeat) cfg.onDefeat(); }
}

function battleAttack(){
  if (!battle || battle.playerAtkCd > 0) return;
  const px = player.x+player.w/2, py = player.y+player.h/2;
  const dmg = rnd(battle.player.atk-3, battle.player.atk+3);
  if (battle.playerRanged){
    battle.playerAtkCd = 0.55;
    const dx = battle.enemyPos.x-px, dy = battle.enemyPos.y-py;
    const d = Math.hypot(dx,dy) || 1;
    battle.projectiles.push({
      x:px, y:py, vx:(dx/d)*520, vy:(dy/d)*520, r:6,
      color: battle.playerProjColor || '#7dffb0', life:2, target:'enemy', dmg
    });
    sfxAttack();
    return;
  }
  battle.playerAtkCd = 0.42;
  const dist = Math.hypot(px-battle.enemyPos.x, py-battle.enemyPos.y);
  if (dist > 95){ toast('Chegue mais perto pra atacar!'); return; }
  battle.enemy.hp -= dmg;
  sfxAttack();
  refreshHpUI();
  if (battle.enemy.hp <= 0){ toast(`${battle.enemy.name} foi derrotado!`); endBattleArena('victory'); }
}
function battleAllyAssist(){
  if (!battle || battle.allyCd > 0) return;
  battle.allyCd = 3.2;
  const dmg = rnd(battle.player.atk+8, battle.player.atk+14);
  battle.enemy.hp -= dmg;
  sfxAllyAssist();
  toast(`Huggy ajuda! ${battle.enemy.name} sofre ${dmg} de dano.`);
  refreshHpUI();
  if (battle.enemy.hp <= 0){ endBattleArena('victory'); }
}
function battleFlee(){
  if (!battle || battle.fleeCd > 0) return;
  battle.fleeCd = 1;
  const chance = battle.fleeChance != null ? battle.fleeChance : 0.5;
  if (Math.random() < chance){ toast('Você conseguiu fugir!'); endBattleArena('fled'); }
  else toast('Não deu pra fugir dessa vez!');
}
function battleTakeDamage(dmg){
  if (!battle) return;
  battle.player.hp -= dmg;
  battle.hitsTaken++;
  sfxEnemyHit();
  refreshHpUI();

  if (battle.guaranteedDefeatAfterTurns && battle.hitsTaken >= battle.guaranteedDefeatAfterTurns){
    toast(battle.scriptedDefeatMsg || 'A situação piora rapidamente...');
    endBattleArena('defeat');
    return;
  }
  if (battle.player.hp <= 0){
    if (battle.secondary && !battle.secondaryUsed){
      battle.secondaryUsed = true;
      battle.player = battle.secondary;
      player.type = battle.player.type;
      toast(`${battle.player.name} entra na luta!`);
      refreshHpUI();
      return;
    }
    toast(`${battle.player.name} foi derrotado...`);
    endBattleArena('defeat');
  }
}
function updateBattle(dt){
  if (!battle) return;
  battle.playerAtkCd = Math.max(0, battle.playerAtkCd - dt);
  battleAttackBtn.disabled = battle.playerAtkCd > 0;
  battle.allyCd = Math.max(0, battle.allyCd - dt);
  battle.fleeCd = Math.max(0, battle.fleeCd - dt);
  battle.enemyAtkCd -= dt;

  const px = player.x+player.w/2, py = player.y+player.h/2;
  const ex = battle.enemyPos.x, ey = battle.enemyPos.y;
  const dx = px-ex, dy = py-ey;
  const dist = Math.hypot(dx,dy) || 1;

  if (battle.ranged){
    if (dist < 230){ battle.enemyPos.x -= (dx/dist)*55*dt; battle.enemyPos.y -= (dy/dist)*55*dt; }
    battle.enemyPos.x = Math.max(70, Math.min(W-70, battle.enemyPos.x));
    battle.enemyPos.y = Math.max(100, Math.min(H-70, battle.enemyPos.y));
    if (battle.enemyAtkCd <= 0){
      battle.enemyAtkCd = 1.35;
      battle.projectiles.push({
        x:ex, y:ey, vx:(dx/dist)*270, vy:(dy/dist)*270, r:7,
        color: battle.enemy.projColor || '#ff5f3a', life:3,
        dmg: rnd(battle.enemy.atk-2, battle.enemy.atk+2)
      });
    }
  } else {
    if (dist > 58){
      const spd = battle.enemy.speed || 105;
      battle.enemyPos.x += (dx/dist)*spd*dt;
      battle.enemyPos.y += (dy/dist)*spd*dt;
    } else if (battle.enemyAtkCd <= 0){
      battle.enemyAtkCd = 1.15;
      battleTakeDamage(rnd(battle.enemy.atk-2, battle.enemy.atk+2));
      if (!battle) return;
    }
  }

  for (let i = battle.projectiles.length-1; i >= 0; i--){
    const pr = battle.projectiles[i];
    pr.x += pr.vx*dt; pr.y += pr.vy*dt; pr.life -= dt;
    if (pr.target === 'enemy'){
      if (Math.hypot(pr.x-battle.enemyPos.x, pr.y-battle.enemyPos.y) < 30){
        battle.enemy.hp -= pr.dmg;
        refreshHpUI();
        battle.projectiles.splice(i,1);
        if (battle.enemy.hp <= 0){ toast(`${battle.enemy.name} foi derrotado!`); endBattleArena('victory'); return; }
        continue;
      }
    } else if (Math.hypot(pr.x-px, pr.y-py) < 24){
      battleTakeDamage(pr.dmg);
      if (!battle) return;
      battle.projectiles.splice(i,1);
      continue;
    }
    if (pr.life <= 0 || pr.x<-20 || pr.x>W+20 || pr.y<-20 || pr.y>H+20) battle.projectiles.splice(i,1);
  }
}

function drawRocketShip(g,x,y,s,launching){
  g.save(); g.translate(x,y);
  if (launching){
    const flick = 0.6 + 0.4*Math.sin(Date.now()/40);
    g.fillStyle = `rgba(255,150,60,${0.7*flick})`;
    g.beginPath(); g.moveTo(-s*0.3,s*0.78); g.lineTo(0,s*1.3+s*0.5*flick); g.lineTo(s*0.3,s*0.78); g.closePath(); g.fill();
    g.fillStyle = `rgba(255,220,120,${0.8*flick})`;
    g.beginPath(); g.moveTo(-s*0.14,s*0.78); g.lineTo(0,s*1.05+s*0.3*flick); g.lineTo(s*0.14,s*0.78); g.closePath(); g.fill();
  }
  g.fillStyle = '#8a3a3a';
  g.beginPath(); g.moveTo(-s*0.4,s*0.5); g.lineTo(-s*0.75,s*0.9); g.lineTo(-s*0.25,s*0.75); g.closePath(); g.fill();

  g.fillStyle = '#e8e8ec';
  g.beginPath();
  g.moveTo(0,-s*1.0);
  g.quadraticCurveTo(s*0.42,-s*0.6,s*0.42,s*0.3);
  g.lineTo(s*0.42,s*0.78);
  g.lineTo(-s*0.42,s*0.78);
  g.lineTo(-s*0.42,s*0.3);
  g.quadraticCurveTo(-s*0.42,-s*0.6,0,-s*1.0);
  g.closePath(); g.fill();
  g.fillStyle = '#c94040';
  g.beginPath();
  g.moveTo(0,-s*1.0); g.quadraticCurveTo(s*0.42,-s*0.6,s*0.42,-s*0.2);
  g.lineTo(-s*0.42,-s*0.2); g.quadraticCurveTo(-s*0.42,-s*0.6,0,-s*1.0);
  g.closePath(); g.fill();
  g.fillStyle = '#7dd8ff';
  g.beginPath(); g.arc(0,-s*0.05,s*0.16,0,Math.PI*2); g.fill();
  g.strokeStyle = '#334'; g.lineWidth = 3; g.beginPath(); g.arc(0,-s*0.05,s*0.16,0,Math.PI*2); g.stroke();
  g.fillStyle = '#c94040'; g.fillRect(-s*0.42,s*0.55,s*0.84,s*0.1);
  g.restore();
}

function drawBigCastleGate(g){
  const grad = g.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#241636'); grad.addColorStop(0.6,'#160f26'); grad.addColorStop(1,'#0a0714');
  g.fillStyle = grad; g.fillRect(0,0,W,H);
  // distant starlight so the huge silhouette actually reads against the sky
  for (let i=0;i<40;i++){
    const sx = (i*137)%W, sy = (i*71)%(H*0.5);
    g.fillStyle = `rgba(220,210,255,${0.15+0.25*((i*53)%10)/10})`;
    g.fillRect(sx,sy,2,2);
  }
  g.fillStyle = '#241a30'; g.fillRect(0,H-120,W,120);
  // two massive towers, much taller and wider than anything seen so far
  [W/2-260,W/2+170].forEach(tx=>{
    g.fillStyle = '#4a3f66'; g.fillRect(tx,20,90,H-140);
    g.fillStyle = '#2e2444'; g.fillRect(tx,20,90,14);
    // conical roof
    g.beginPath(); g.moveTo(tx-14,20); g.lineTo(tx+45,-40); g.lineTo(tx+104,20); g.closePath();
    g.fillStyle = '#6a2fb0'; g.fill();
    // glowing windows running up the tower
    for (let wy=60; wy<H-160; wy+=70){
      g.fillStyle = 'rgba(255,200,90,0.9)'; g.fillRect(tx+34,wy,22,30);
      g.fillStyle = 'rgba(255,200,90,0.3)'; g.fillRect(tx+24,wy-6,42,42);
    }
  });
  // grand central archway
  g.fillStyle = '#1a1428'; g.beginPath();
  g.moveTo(W/2-110,H-40); g.lineTo(W/2-110,10); g.quadraticCurveTo(W/2,-70,W/2+110,10); g.lineTo(W/2+110,H-40); g.closePath(); g.fill();
  g.strokeStyle = '#a06fe0'; g.lineWidth = 5; g.stroke();
  g.fillStyle = '#050308'; g.fillRect(W/2-70,H-140,140,100);
  // twin banners flanking the arch
  ['#a020f0','#ff9a5c'].forEach((c,i)=>{
    const bx = W/2 + (i===0? -160:120);
    g.fillStyle = c; g.fillRect(bx,40,26,150);
    g.beginPath(); g.moveTo(bx,190); g.lineTo(bx+13,215); g.lineTo(bx+26,190); g.closePath(); g.fill();
  });
  g.fillStyle = '#e8d8ff'; g.font='bold 15px sans-serif'; g.textAlign='center';
  g.fillText('O GRANDE CASTELO', W/2, H-160);
  g.fillStyle = 'rgba(255,140,150,0.75)'; g.font='12px sans-serif';
  g.fillText('← Encruzilhada', 90, H-30);
}
function drawSecretForest(g){
  const grad = g.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#0e1a10'); grad.addColorStop(1,'#070d08');
  g.fillStyle = grad; g.fillRect(0,0,W,H);
  g.fillStyle = '#0a140b'; g.fillRect(0,H-100,W,100);
  const trees = [[80,180],[220,120],[400,220],[620,140],[880,160]];
  trees.forEach(([tx,ty])=>{
    g.fillStyle = '#1a2a16'; g.fillRect(tx-8,ty,16,H-ty-90);
    g.fillStyle = '#152a18'; g.beginPath(); g.ellipse(tx,ty-10,44,58,0,0,Math.PI*2); g.fill();
  });
  g.fillStyle = '#3a2a1a'; g.fillRect(W-90,H/2-70,50,140);
  g.strokeStyle = '#6a4a2a'; g.lineWidth = 3; g.strokeRect(W-90,H/2-70,50,140);
  g.fillStyle = '#ffd54a'; g.beginPath(); g.arc(W-50,H/2,5,0,Math.PI*2); g.fill();
  g.font='11px sans-serif'; g.textAlign='center';
  g.fillStyle = 'rgba(200,180,220,0.5)'; g.fillText('← Encruzilhada', 90, H/2-90);
  g.fillStyle = 'rgba(255,213,74,0.7)'; g.fillText('porta trancada →', W-65, H/2-90);
}
function drawBigCastleInterior(g){
  const grad = g.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#201a2c'); grad.addColorStop(1,'#120e1a');
  g.fillStyle = grad; g.fillRect(0,0,W,H);
  g.fillStyle = '#2a2438'; g.fillRect(20,60,W-40,H-90);
  for (let cx=300; cx<=620; cx+=320){
    g.fillStyle = '#3a3250'; g.fillRect(cx,70,26,H-140);
  }
  [140,460,780].forEach(tx=>{
    g.fillStyle = '#ffaa3a'; g.beginPath(); g.arc(tx,120,7,0,Math.PI*2); g.fill();
    g.fillStyle = 'rgba(255,170,58,0.25)'; g.beginPath(); g.arc(tx,120,22,0,Math.PI*2); g.fill();
  });
  g.font='11px sans-serif'; g.textAlign='center';
  g.fillStyle = 'rgba(255,120,120,0.55)'; g.fillText('↑ Sala do Rei (precisa da Esmeralda do Disfarce)', W/2, 50);
  g.fillStyle = 'rgba(150,255,180,0.5)'; g.fillText('Câmara escondida ↓', 420, H-24);
}
function drawTreasureRoom(g){
  const grad = g.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#1a1428'); grad.addColorStop(1,'#0e0a18');
  g.fillStyle = grad; g.fillRect(0,0,W,H);
  g.fillStyle = '#241c34'; g.fillRect(40,80,W-80,H-140);
  g.fillStyle = '#3a2c4a';
  for (let i=0;i<5;i++) g.fillRect(70+i*170,H-100,100,20);
  // exit doorway, left wall
  g.fillStyle = '#0a0812'; g.fillRect(0,H/2-60,40,120);
  g.strokeStyle = 'rgba(154,95,224,0.6)'; g.lineWidth = 3; g.strokeRect(0,H/2-60,40,120);
  g.fillStyle = 'rgba(154,95,224,0.8)'; g.font='12px sans-serif'; g.textAlign='center';
  g.fillText('← Saída', 70, H/2-70);
}
function drawKingRoom(g){
  const grad = g.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#2a1638'); grad.addColorStop(1,'#160a20');
  g.fillStyle = grad; g.fillRect(0,0,W,H);
  g.fillStyle = '#3a1f52'; g.fillRect(0,H-120,W,120);
  g.fillStyle = '#7a1f2a'; g.fillRect(W/2-50,H-260,100,260);
  g.fillStyle = '#4a1f6e'; g.fillRect(W/2-70,H/2-100,140,120);
  g.fillStyle = '#ffd54a'; g.fillRect(W/2-70,H/2-100,140,14);
  g.strokeStyle = '#ffd54a'; g.lineWidth = 3; g.strokeRect(W/2-70,H/2-100,140,120);
  g.font='11px sans-serif'; g.textAlign='center';
  g.fillStyle = 'rgba(200,180,220,0.6)'; g.fillText('← Sair', 70, H/2-90);
}

          metKing = true;
          startDialogue([
            {speaker:'Rei', text:'Poucos chegam tão longe disfarçados... o que vieram buscar em meu reino?', color:'#ffd54a'},
            {speaker:'Duo', text:'Só queríamos passagem segura. Não viemos causar problema.', color:'#7ef9ff'},
            {speaker:'Rei', text:'Vocês trazem um titã derrotado nas costas e uma esmeralda proibida... isso já é problema o bastante.', color:'#ffd54a'},
            {speaker:'Rei', text:'Mas sinto também o cheiro de outra coisa em vocês — algo que despertou lá fora. Fiquem atentos. Esse castelo tem mais olhos do que parece, e o mundo além dele guarda perigo bem maior.', color:'#ffd54a'},
            {speaker:'Cueio', text:'Precisamos ir. Já arriscamos demais ficando aqui.', color:'#ffb066'},
            {speaker:'Duo', text:'Vamos. Já temos o que viemos buscar.', color:'#7ef9ff'},
          ], ()=> endChapter4());
        } }
    ],
    exits: [ {x:0,y:H/2-60,w:40,h:120, onEnter: ()=> goToScene(bigCastleInterior, {x:W/2-17,y:110})} ]
  };

  return { start: ()=> goToScene(bunkerOutside, {x:40,y:H/2-20}) };
}

/* ---------------- chapter flow / menus ---------------- */
const menuOverlay = document.getElementById('menuOverlay');
const endOverlay = document.getElementById('endOverlay');
const endTitle = document.getElementById('endTitle');
const endText = document.getElementById('endText');
const endButtons = document.getElementById('endButtons');

let ch1 = null, ch2 = null, ch3 = null, ch4 = null;

function startChapter(n){
  menuOverlay.classList.add('hidden');
  endOverlay.classList.add('hidden');
  if (n===1){ player.type = 'duo'; ch1 = buildChapter1(); ch1.start(); }
  if (n===2){ player.type = 'astro'; ch2 = buildChapter2(); ch2.start(); }
  if (n===3){ player.type = 'duo'; ch3 = buildChapter3(); ch3.start(); }
  if (n===4){ player.type = 'duo'; ch4 = buildChapter4(); ch4.start(); }
}
function endChapter(){
  unlocked.ch3 = true;
  showEndingScreen({
    title: 'Fim do Capítulo 2',
    text: 'Astro encontrou um aliado inesperado em Vulcrom. Mas o destino ainda vai colocá-lo no caminho de alguém conhecido...',
    buttons: [ {label:'Capítulo 3 →', fn:()=> startChapter(3)}, {label:'Menu', fn:showMenu, secondary:true} ]
  });
}
function endChapter3(){
  unlocked.ch4 = true;
  showEndingScreen({
    title: 'Fim do Capítulo 3 — Aliados',
    text: 'Duo, Astro e Huggy derrotaram a Arma Guardiã e agora têm um arsenal e uma Joia do Teleporte em mãos. Juntos, talvez tenham uma chance real contra o que vem por aí.',
    buttons: [ {label:'Capítulo 4 →', fn:()=> startChapter(4)}, {label:'Menu', fn:showMenu, secondary:true} ]
  });
}
function endChapter4(){
  showEndingScreen({
    title: 'Fim do Capítulo 4 — O Grande Castelo',
    text: 'Duo, Astro, Huggy e Cueio escaparam do olhar do Rei com a Esmeralda do Disfarce e a Esmeralda dos Elementos em mãos. O Titã Batedor foi só o começo — e o aviso do Rei ecoa: tem algo maior se movendo lá fora. Continua em breve, no mundo aberto...',
    buttons: [ {label:'Menu', fn:showMenu, secondary:true} ]
  });
}
function endingDefeatCh3(){
  showEndingScreen({
    title: 'Final: Superados',
    text: 'A Arma Guardiã provou ser forte demais para os três. Talvez precisem se preparar melhor antes de tentar de novo.',
    buttons: [ {label:'Tentar novamente', fn:()=> startChapter(3)}, {label:'Menu', fn:showMenu, secondary:true} ]
  });
}
function showEndingScreen(opts){
  currentScene = null;
  sceneLocked = true;
  endOverlay.classList.remove('hidden');
  endButtons.innerHTML = '';
  endTitle.textContent = opts.title;
  endText.textContent = opts.text;
  (opts.buttons||[]).forEach(b=> mkEndBtn(b.label, b.fn, b.secondary));
}
function endingTrueCh1(){
  unlocked.ch2 = true;
  showEndingScreen({
    title: 'Fim do Capítulo 1 — A Vingança Desperta',
    text: 'As plantas antigas confiaram a Duo a Joia da Vida e um aviso: aquelas naves voltarão. Essa não é mais uma fuga — é o início de uma vingança.',
    buttons: [ {label:'Capítulo 2 →', fn:()=> startChapter(2)}, {label:'Menu', fn:showMenu, secondary:true} ]
  });
}
function endingEscapistCh1(){
  unlocked.ch2 = true;
  showEndingScreen({
    title: 'Final Escapista',
    text: 'Duo não olhou para trás. Correu sem parar, ignorando os sussurros das plantas de olho aberto. Escapou... mas sem a Joia da Vida, sem respostas, e sem saber ao certo para onde esse caminho vai realmente dar.',
    buttons: [ {label:'Capítulo 2 →', fn:()=> startChapter(2)}, {label:'Menu', fn:showMenu, secondary:true} ]
  });
}
function endingDeathCh1(){
  showEndingScreen({
    title: 'Final: Caído em Combate',
    text: 'O drone foi rápido demais dessa vez. Duo lutou com tudo o que tinha, mas não foi suficiente... Talvez uma nova tentativa mude o destino.',
    buttons: [ {label:'Tentar novamente', fn:()=> startChapter(1)}, {label:'Menu', fn:showMenu, secondary:true} ]
  });
}
function endingCowardCh1(){
  unlocked.ch2 = true;
  showEndingScreen({
    title: 'Final Covarde',
    text: 'Duo se enfiou debaixo do próprio ninho e ficou lá, quietinho, o coração disparado. Nenhuma luta, nenhuma fuga pela vila — só o barulho da nave lá fora, sumindo aos poucos. Ele sobreviveu... mas vai ter que conviver com essa escolha.',
    buttons: [ {label:'Capítulo 2 →', fn:()=> startChapter(2)}, {label:'Menu', fn:showMenu, secondary:true} ]
  });
}
function mkEndBtn(label, fn, secondary){
  const b = document.createElement('button');
  b.className = 'gameBtn' + (secondary ? ' secondary' : '');
  b.textContent = label; b.onclick = fn;
  endButtons.appendChild(b);
}
function showMenu(){
  currentScene = null;
  endOverlay.classList.add('hidden');
  menuOverlay.classList.remove('hidden');
  document.getElementById('btnCh2').classList.toggle('locked', false);
}
document.getElementById('btnCh1').onclick = ()=> startChapter(1);
document.getElementById('btnCh2').onclick = ()=> startChapter(2);
document.getElementById('btnCh3').onclick = ()=> startChapter(3);
document.getElementById('btnCh4').onclick = ()=> startChapter(4);

/* ---------------- pause / settings menu ---------------- */
const settingsBtn = document.getElementById('settingsBtn');
const settingsOverlay = document.getElementById('settingsOverlay');
const segDifficulty = document.getElementById('segDifficulty');
const segQuality = document.getElementById('segQuality');
const selLanguage = document.getElementById('selLanguage');
const rangeScale = document.getElementById('rangeScale');
const rangeSafe = document.getElementById('rangeSafe');
let settingsOpen = false;

function applyScale(){
  document.documentElement.style.setProperty('--ui-scale', settings.scale/100);
  document.getElementById('valScale').textContent = settings.scale + '%';
}
function applySafeArea(){
  document.documentElement.style.setProperty('--safe', settings.safe + 'px');
  document.getElementById('valSafe').textContent = settings.safe + 'px';
}
function applyQuality(){
  document.body.classList.toggle('lowfx', settings.quality === 'baixa');
}
function refreshSettingsUI(){
  [...segDifficulty.children].forEach(b=> b.classList.toggle('active', b.dataset.val === settings.difficulty));
  [...segQuality.children].forEach(b=> b.classList.toggle('active', b.dataset.val === settings.quality));
  selLanguage.value = settings.language;
  rangeScale.value = settings.scale;
  rangeSafe.value = settings.safe;
  applyScale(); applySafeArea(); applyQuality();
}
function toggleSettings(){ settingsOpen ? closeSettings() : openSettings(); }
function openSettings(){
  settingsOpen = true;
  refreshSettingsUI();
  settingsOverlay.classList.add('open');
}
function closeSettings(){
  settingsOpen = false;
  settingsOverlay.classList.remove('open');
}
function forceStopEverything(){
  if (battle){ battleOverlay.style.display = 'none'; battleAttackBtn.style.display = 'none'; battle = null; }
  dialogueActive = false; dialogueQueue = []; dialogueIdx = 0; dialogueOnEnd = null;
  document.getElementById('dialogueBox').style.display = 'none';
  sceneLocked = false;
}

settingsBtn.addEventListener('click', toggleSettings);
document.getElementById('btnResume').addEventListener('click', closeSettings);
document.getElementById('btnCloseSettings').addEventListener('click', closeSettings);
document.getElementById('btnGoWorld').addEventListener('click', ()=>{
  forceStopEverything();
  closeSettings();
  showMenu();
});
document.getElementById('btnRestart').addEventListener('click', ()=>{
  forceStopEverything();
  unlocked = { ch2:false, ch3:false, ch4:false };
  upgrades = { jewelOfLife:false, emeraldOfPower:false, alienWeapon:false, teleportGem:false, elementalEmerald:false, disguiseEmerald:false };
  closeSettings();
  showMenu();
});
segDifficulty.addEventListener('click', e=>{
  const b = e.target.closest('.segBtn'); if (!b) return;
  settings.difficulty = b.dataset.val;
  refreshSettingsUI();
});
segQuality.addEventListener('click', e=>{
  const b = e.target.closest('.segBtn'); if (!b) return;
  settings.quality = b.dataset.val;
  refreshSettingsUI();
});
selLanguage.addEventListener('change', ()=>{ settings.language = selLanguage.value; });
rangeScale.addEventListener('input', ()=>{ settings.scale = +rangeScale.value; applyScale(); });
rangeSafe.addEventListener('input', ()=>{ settings.safe = +rangeSafe.value; applySafeArea(); });
refreshSettingsUI();

/* ---------------- main loop ---------------- */
let lastT = performance.now();
function loop(t){
  const dt = Math.min(0.05,(t-lastT)/1000); lastT = t;
  if (!settingsOpen){
    updateExploration(dt);
    updateBattle(dt);
  }
  updateActionButton();
  updateInventoryHud();
  renderScene();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
<script>
if ('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('/sw.js').catch(()=>{}));
}
</script>
